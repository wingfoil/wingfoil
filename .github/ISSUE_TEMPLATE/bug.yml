# Bug report — the fields are the `bug` Memory element's (.wingfoil/memory/templates/bug.md), so that
# `bug-ingest`'s `capture` phase can be run from the issue without asking the reporter again
# (dl-127; pinned by test/docs/community-health.test.ts).
name: Bug report
description: Report a defect in WingFoil. It is captured as a `bug` element in the project's Memory.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. WingFoil takes contributions as Memory elements
        ([COLLABORATION.md](https://github.com/wingfoil/wingfoil/blob/main/COLLABORATION.md)): a maintainer or an
        agent captures this issue as a `bug` element, with your GitHub handle as its `contributor` and this
        issue's URL beside it, so you are credited for the work derived from it.

        The issue title is the bug's title: one short line, e.g. "memory submit crashes on missing frontmatter".
        For a vulnerability, do not use this form: follow
        [SECURITY.md](https://github.com/wingfoil/wingfoil/blob/main/SECURITY.md).
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How badly it hurts, as you judge it. The maintainers confirm it at triage.
      options:
        - critical
        - high
        - medium
        - low
    validations:
      required: true
  - type: input
    id: release-origin
    attributes:
      label: WingFoil version
      description: The version where you found the bug — the output of `wingfoil --version`.
      placeholder: "0.2.2"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the defect.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: The exact steps that trigger the bug, as a numbered list.
      placeholder: |
        1. wingfoil init
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What happens instead. Include the error message and the exit code if there is one.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Optional — your environment (OS, Node.js version), a workaround, a suspected cause.
    validations:
      required: false
