# WingFoil — npm publish pipeline (adr-009 points 1–3, adr-011, spec-015 §3–§5, dl-018 T3; built by
# task-060, promotion reworked by task-113, server.json versions added to the tag check by task-115, the
# GitHub Release job added by task-229, dl-130 step 1; the MCP Registry job, the job timeouts and the
# annotated-tag check added by task-238, dl-130 step 2 and dl-057 (b), (d); the test reports added by task-244,
# dl-136).
#
#   gate    → assert the tag is on main, is an annotated tag (`check-release-tag.cjs --annotated`, dl-057 (d)),
#             and equals v<package.json version>, and that server.json's
#             `version` and every `packages[].version` equal it too (spec-015 §4), `npm ci`,
#             prepublishOnly's three commands as three steps — `npm run build`, `npm run test:report` (the
#             suite once, with coverage and Jest's `--json` into coverage/), `npm run lint` — then
#             `scripts/test-report.cjs` writes the Markdown summary (dl-136), `npm publish --dry-run` (the
#             manifest), pack ONCE; the tarball is uploaded first, the four test reports LAST
#   stage   → `npm run publish:staging -- --tarball <that tarball> --expect-commit "$GITHUB_SHA"`:
#             ephemeral Verdaccio, publish, clean `npm install -g`, dl-023 init + CLI smoke — whose
#             `wingfoil --version` must be exactly `<version> (<GITHUB_SHA>)`, the commit the gate built
#             (task-254, bug-235) — teardown; the very script a developer runs
#   promote → `npm stage publish` THAT SAME tarball to npm with provenance. The version is NOT live yet:
#             it waits in npm's stage queue until the approver approves it on npm with 2FA (adr-011).
#   release → once `npm view wingfoil@<version> version` answers exactly that version (never `@latest`,
#             dl-159), create the GitHub Release `vX.Y.Z` with the version's CHANGELOG.md section as notes
#             (`scripts/changelog-section.cjs`, extracted first, so a missing section fails at once), and
#             attach the gate's four test reports — jest-results.json, coverage-summary.json, lcov.info and
#             test-results.md (dl-136 Q1 (c), Q3 (a): the tag's run describes the published commit). The wait
#             is a bounded poll, `scripts/wait-npm-version.cjs --timeout-minutes 330 --interval-seconds 60`,
#             inside `timeout-minutes: 345`: a GitHub-hosted job runs for at most 6 hours, so a longer wait
#             cannot live in one job (task-229). `contents: write` is granted to this job alone, and `gh` gets
#             the job's own token on the create step only. Whether the Release is marked latest is
#             `RELEASE_MAKE_LATEST`, empty = gh's default (task-266 sets it).
#   mcp-registry → after promote, beside release: list the version in the MCP Registry
#             (registry.modelcontextprotocol.io). `mcp-publisher`, a pinned release whose archive is checked
#             against a frozen SHA-256 before it is unpacked, validates `server.json`, then the job waits with
#             the same bounded poll as release — the registry reads `mcpName` from the PUBLISHED package.json,
#             so the version must be live on npm — then `mcp-publisher login github-oidc` and `publish`.
#             The OIDC token is granted `io.github.<repository owner>/*` = `io.github.wingfoil/*` (registry
#             v1.8.1, `github_oidc.go` `buildPermissions`) with no OAuth app in between; v0.2.2's manual publish
#             was refused with a 403, the registry's OAuth app likely not seeing the organisation (bug-173's
#             suspected cause, not verified) — the OIDC grant holds either way. `id-token: write` is
#             granted to this job and promote only. Its one job-level `if:` is where task-266 adds its
#             "newest version only" rule; nothing here names `latest`.
#
# ── Job timeouts (dl-057 (b) option 1, task-238) ──
#
#   Every job declares `timeout-minutes`:  gate 30 · stage 20 · promote 30 · release 345 · mcp-registry 345.
#   stage and promote are task-077's measured table ("Suggested `timeout-minutes`", sized from the first
#   real `act` run, generous enough not to flake); the v0.2.2 run took stage 42s and promote 16s. gate
#   is raised from that table's 15: it runs `prepublishOnly`, whose suite has grown since — the same step
#   in ci.yml's packaging gate took 7m22s in CI run 38166281488 (2026-10-11, job 7m56s; 6m18s–7m56s
#   over the three main pushes before it), against v0.2.2's 1m22s gate. promote is not raised for its
#   `npm-publish` approval: that wait happens before the job starts on a runner (v0.2.2: deployment
#   6744965514 waiting 20:39:08Z → in_progress 20:40:59Z; job started 20:40:58Z), so the timeout
#   bounds only its work. release and mcp-registry carry their 330-minute npm poll plus a margin, under the
#   hosted runner's 6-hour job limit.
#   Since task-244 gate runs that suite once with coverage (`npm run test:report`), which adds the
#   instrumentation's cost to those 7 minutes; 30 is kept, and the v0.3.0 tag run's gate duration is checked
#   against it at v0.3 release-publishing (approver ruling D5, 2026-10-12).
#
# Trigger: a `vX.Y.Z` tag push. The tag is created on `main` after the release branch merges (dl-024);
# the gate refuses a tag whose commit is not on `main`.
#
# ── Credential, release authorization and rollback (spec-015 §5, adr-011, adr-006; task-113) ──
#
#   There is NO publish credential anywhere: no secret in this workflow, no token in any secret store,
#   no `.npmrc` written. `promote` authenticates to npm as a trusted publisher over GitHub OIDC
#   (`id-token: write`, held by promote and, for the MCP Registry, mcp-registry), configured on npmjs.com with permission limited to staging: it can
#   put a version in the stage queue and nothing else — a plain `npm publish` from this workflow is refused.
#   The same OIDC identity signs the provenance statement. Locally, a developer needs no npm credential
#   for a release at all; the only human npm act is the 2FA approval below.
#
#   Approver runbook — every step below is a human action by the `approver` role (adr-006, adr-011
#   point 5); agents never hold approval authority and never configure the registry.
#
#   GitHub side (done for v0.2, kept by adr-011 point 3 for at least the first staged release):
#   A. Settings → Environments → `npm-publish`: the approver is its required reviewer and its deployment
#      tags are restricted to `v*`. Without it GitHub creates the environment unprotected on the first
#      run, and promote would NOT wait for approval.
#
#   npm side, once, in this order:
#   1. Enable two-factor authentication (2FA) on the approver's npm account. It is a prerequisite of
#      staged publishing: approving a staged version prompts for it, in the CLI and on npmjs.com alike.
#   2. After the repository transfer to `wingfoil/wingfoil` (task-116, dl-091 Q3) — not before, since the
#      publisher is keyed on the repository — add a trusted publisher on npmjs.com → package `wingfoil` →
#      Settings → Trusted publishing → GitHub Actions, with
#        organisation `wingfoil`, repository `wingfoil`, workflow `publish.yml`, environment `npm-publish`
#      and permission limited to staging (stage only).
#      Until it exists, promote fails at `npm stage publish`: expected, and why v0.2.2's
#      release-publishing waits for both task-113 and task-116. A later rename or transfer of the
#      repository, or of this file, must be mirrored there, or promotion fails (adr-011, Consequences).
#   3. Package settings → Publishing access: "Require two-factor authentication and disallow tokens", so
#      no token of any kind can publish `wingfoil` (npm's recommendation once a trusted publisher exists).
#   4. Revoke the stage-only token on npmjs.com, then delete the environment secret that held it in
#      `npm-publish` (`gh secret list --env npm-publish` names it; `gh secret delete <name> --env
#      npm-publish`). Nothing in this workflow reads it any more.
#
#   Every release:
#   5. The tag `vX.Y.Z` is pushed on `main` (spec-015 §4); gate and stage run unattended; promote waits
#      in `npm-publish` until the approver approves the deployment (rejecting it ends the run with
#      nothing staged). Promote then stages the tarball and prints its stage id.
#   6. Inspect, then approve on npm:
#        npm stage list wingfoil            # find the stage id
#        npm stage view <stage-id>          # what is staged; `npm stage download <stage-id>` for the tarball
#        npm stage approve <stage-id>       # 2FA prompt — the version goes live
#      A bad staged version is discarded with `npm stage reject <stage-id>`: it never goes live.
#      These commands need npm ≥ 11.15.0 on the approver's machine. Without a global upgrade, run each through
#      npx, e.g. `npx -y npm@<version> stage approve <stage-id>` with <version> ≥ 11.15.0 (bug-174).
#      On npmjs.com: open the account menu (the signed-in user's menu) → Staged Packages; the tab is there,
#      not on the package page. A freshly staged version first shows as in "automated review": Approve is
#      not available until that review ends, so wait and reload (v0.2.2 was staged by 20:41Z and live at
#      20:47Z after its review and the approval, bug-174).
#   7. The `release` job creates the GitHub Release by itself once the approved version is live. If the
#      approval came after its poll gave up (330 minutes after promote), the job fails with
#      "… is not live on npm after …": approve on npm, then open the run and use Re-run failed jobs (up to
#      30 days after the run). Promote succeeded, so it is not re-run; the release job polls again and
#      creates the Release. A rejected stage leaves the job failed and no Release, which is correct.
#      The Release carries the gate's four test reports as assets; release-publishing then commits the summary
#      and coverage-summary.json under docs/07_gates/, at paths keyed by the version (dl-136, task-244).
#   8. The `mcp-registry` job lists the version in the MCP Registry by itself, in parallel with step 7, once
#      the version is live (task-238, bug-173). Nothing to configure: the namespace `io.github.wingfoil/*`
#      follows from this repository's owner through GitHub OIDC. Its recovery is step 7's: after a late
#      approval, Re-run failed jobs re-runs it with release. A registry refusal (a version already listed, a
#      `server.json` the registry rejects) fails only this job; the npm version and the Release stand.
#      Re-running an `mcp-registry` job that succeeded is always refused — the registry accepts each version
#      once — so a re-run after a late approval must not include a succeeded one (Re-run all jobs would). Check:
#        curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.wingfoil/wingfoil"
#
#   Rollback posture: a failed stage (staging publish, install or dl-023 smoke) blocks promote — `needs:
#   stage` means promote never runs — and a bad tarball that was staged is stopped by `npm stage reject`.
#   For a bad version that did go live, do NOT use `npm unpublish` (restricted by npm's unpublish
#   policy, and it removes a version others may already depend on); instead
#        npm deprecate wingfoil@X.Y.Z "broken: <reason> — upgrade to X.Y.Z+1"
#   run by the approver with their own npm login, then ship the fix as a patch release through this
#   same tag flow.
#
# ── Node versions: the floor for gate and stage, a newer Node for promote alone (adr-011 point 4) ──
#
# `gate` and `stage` run `env.NODE_VERSION` = 22.12.0 — the lowest version every PRODUCTION dependency
# accepts (commander@15 declares `engines.node >=22.12.0`; @hono/node-server@2.1.3, transitive via
# @modelcontextprotocol/sdk, declares >=20 — task-250). Since task-074 closed bug-023, `package.json` declares
# that same floor — `engines.node >=22.12.0` (adr-010) — and `test/cli/publish-metadata.test.ts`
# recomputes it from the installed tree, so the two cannot drift apart again. Do not add Node 18/20
# here: the package no longer claims to run there.
# NOT covered by this pin: some devDependencies want more than 22.12.0 (eslint@10 and @eslint/js@10
# declare `^20.19.0 || ^22.13.0 || >=24`), so `npm ci` in these jobs emits EBADENGINE warnings for
# them. Harmless today — no `engine-strict` — but it means 22.12.0 is the floor of the production
# closure only, not of the dev toolchain.
#
# `promote` runs `jobs.promote.env.PROMOTE_NODE_VERSION` instead. Staged publishing needs npm ≥ 11.15.0,
# and no Node 22 release bundles npm 11 (the latest 22.x bundles npm 10.9.x); the oldest Node that
# bundles npm ≥ 11.15.0 is 24.18.0 (https://nodejs.org/dist/index.json). The pin is 24.21.0, the latest
# 24.x when task-113 pinned it (2026-09-29), which bundles npm 11.19.0 and carries the 24.18.1 security
# release. Promote builds and tests nothing, so the asymmetry costs no coverage of the floor: CI keeps
# testing 22.12.0 in gate and stage, and only the job that talks to the registry leaves it.
#
# ── Pinned actions and the promote step's shell (dl-057 items a, f; task-078; bug-136, task-113) ──
#
#   Every `uses:` names a full commit SHA, with the release tag it came from in a trailing comment.
#   A mutable tag would let a retagged upstream release execute inside `promote` — the one job that
#   holds an OIDC token npm accepts. Each pin is the latest release of that action whose `action.yml`
#   declares `runs.using: node24`, a runtime the hosted runners ship (their Node 20 was removed on
#   2026-09-23, bug-136). To check a pin against its comment and its runtime:
#        git ls-remote https://github.com/actions/checkout refs/tags/v7.0.1
#        gh api "repos/actions/checkout/contents/action.yml?ref=v7.0.1" --jq .content | base64 -d
#   `test/cli/publish-pipeline.test.ts` freezes the SHA ↔ tag table, so a pin edited without redoing that
#   lookup fails the suite; it cannot re-read `action.yml` offline, and Dependabot is not configured.
#   Every `actions/setup-node` step sets `package-manager-cache: false`: since setup-node v5 the action
#   turns caching on by itself when `package.json` names a package manager, and a release pipeline takes
#   nothing from a cache it did not declare.
#
#   The promote stage step runs with xtrace off (`set +x`, its first command). It holds no secret any
#   more, but tracing stays banned — the rule costs nothing and would matter again the day a credential
#   came back. The suite under `test/cli/` that pins the credential rules fails if tracing is
#   reintroduced in the step body or through a `shell:` override.
#
# ── Running this workflow locally with `act` (nektos/act) — no throwaway CI-debug commits (adr-009) ──
#
#   1. Describe a tag push:
#        echo '{"ref": "refs/tags/v0.2.2", "ref_name": "v0.2.2", "ref_type": "tag"}' > /tmp/tag-event.json
#      (use the version currently in package.json — and in server.json — or the gate's tag check fails,
#      which is correct).
#   2. Run the pipeline with a local artifact server so gate → stage → promote can hand the tarball on:
#        act push --eventpath /tmp/tag-event.json --artifact-server-path /tmp/act-artifacts
#      or one job at a time: `act push --eventpath /tmp/tag-event.json --artifact-server-path /tmp/act-artifacts -j gate`
#   3. act sets `ACT=true`: the promote stage step is skipped (`if: !env.ACT`), so a local run can never
#      stage; the release job's npm poll and `gh release create` are skipped the same way, while its
#      CHANGELOG extraction still runs; the mcp-registry job installs and validates, and skips its poll, its
#      login and its publish. act has no OIDC issuer and ignores `environment:`, so the trusted publisher,
#      provenance, the registry login and both approvals can only be exercised by a real tag push.
#   act cannot run from a git worktree (bug-060): in a worktree `.git` is a file holding the absolute host
#   path of the main repository's `.git/worktrees/<name>`, which act does not mount into the container, so
#   every git step fails with `fatal: not a git repository`. Run it from a real clone instead:
#        git clone <this repository> /tmp/wingfoil-act && cd /tmp/wingfoil-act
#   The gate's "tag is on main" check needs a local `main` pushed to `origin`; for a dry iteration on a
#   branch, run `npm run prepublishOnly` and `npm run publish:staging` directly instead — they are the
#   same commands the gate and stage jobs run.

name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.12.0'
  TARBALL_ARTIFACT: wingfoil-tarball
  REPORTS_ARTIFACT: wingfoil-test-reports

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Tag commit is on main (dl-024)
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Tag, package.json and server.json versions match (spec-015 §4)
        run: node scripts/check-release-tag.cjs "$GITHUB_REF_NAME"
      - name: Tag is annotated (spec-015 §4, dl-057 (d))
        run: node scripts/check-release-tag.cjs --annotated "$GITHUB_REF_NAME"
      - name: Install
        run: npm ci
      # prepublishOnly's three commands (spec-015 §2) as three steps, the test one with coverage and Jest's
      # `--json` (task-244, dl-136 Q3 (a)): one suite run, the coverage threshold enforced at the tag.
      - name: Build (prepublishOnly 1/3)
        run: npm run build
      - name: Test with coverage and Jest JSON (prepublishOnly 2/3, dl-136)
        run: npm run test:report
      - name: Lint (prepublishOnly 3/3)
        run: npm run lint
      - name: Test results summary — classified per suite (dl-136)
        run: >-
          node scripts/test-report.cjs --results coverage/jest-results.json
          --coverage-summary coverage/coverage-summary.json --build-info dist/build-info.json
          --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --out coverage/test-results.md
      - name: Publish manifest (dry run)
        run: npm publish --dry-run --ignore-scripts
      - name: Pack the release tarball once
        run: |
          mkdir -p dist-pack
          npm pack --ignore-scripts --pack-destination dist-pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.TARBALL_ARTIFACT }}
          path: dist-pack/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.REPORTS_ARTIFACT }}
          path: |
            coverage/jest-results.json
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/test-results.md
          if-no-files-found: error

  stage:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.TARBALL_ARTIFACT }}
          path: dist-pack
      - name: Stage on ephemeral Verdaccio + dl-023 smoke (spec-015 §3 stages 2–3)
        run: npm run publish:staging -- --tarball dist-pack/*.tgz --expect-commit "$GITHUB_SHA"

  promote:
    needs: stage
    runs-on: ubuntu-24.04
    environment: npm-publish
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PROMOTE_NODE_VERSION: '24.21.0'
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PROMOTE_NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.TARBALL_ARTIFACT }}
          path: dist-pack
      - name: Stage the smoked tarball on npm with provenance, via the OIDC trusted publisher (spec-015 §3 stage 4, adr-011)
        if: ${{ !env.ACT }}
        run: |
          set +x
          npm --version
          npm stage publish ./dist-pack/*.tgz --provenance --access public

  release:
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: write
    env:
      RELEASE_MAKE_LATEST: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Release notes — the version's CHANGELOG.md section (dl-130 step 1)
        run: node scripts/changelog-section.cjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        name: Test reports — the gate's artifact, attached to the Release (dl-136)
        with:
          name: ${{ env.REPORTS_ARTIFACT }}
          path: test-reports
      - name: Wait until npm serves exactly this version — promote only staged it (adr-011)
        if: ${{ !env.ACT }}
        run: node scripts/wait-npm-version.cjs "$GITHUB_REF_NAME" --timeout-minutes 330 --interval-seconds 60
      - name: Create the GitHub Release
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" test-reports/jest-results.json test-reports/coverage-summary.json test-reports/lcov.info test-reports/test-results.md --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" ${RELEASE_MAKE_LATEST:+--latest="$RELEASE_MAKE_LATEST"}

  mcp-registry:
    needs: promote
    if: ${{ needs.promote.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: '1.8.1'
      MCP_PUBLISHER_SHA256: 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Install mcp-publisher — the pinned release, its archive checked before it is unpacked (bug-173)
        shell: bash          # GitHub then runs `bash --noprofile --norc -eo pipefail {0}`, as the test does
        run: |
          archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" --version
      - name: Validate server.json against the registry
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'
      - name: Wait until npm serves exactly this version — the registry reads its published mcpName
        if: ${{ !env.ACT }}
        run: node scripts/wait-npm-version.cjs "$GITHUB_REF_NAME" --timeout-minutes 330 --interval-seconds 60
      - name: Log in to the MCP Registry with this workflow's OIDC token (io.github.wingfoil/*)
        if: ${{ !env.ACT }}
        run: '"$RUNNER_TEMP/mcp-publisher" login github-oidc'
      - name: Publish the listing (dl-130 step 2)
        if: ${{ !env.ACT }}
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'
