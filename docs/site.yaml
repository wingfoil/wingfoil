# WingFoil — the documentation site's declared sources and its llms.txt index (dl-129 §2 Q2 (b), §3 Q3 (b);
# task-234). One declaration, two consumers, so they cannot drift:
#   - `node scripts/build-site.cjs site --out <dir> --ref <commit>` assembles the site from `pages` and `files`
#     (the Pages workflow, .github/workflows/pages.yml, then adds `npm run docs:api`'s HTML under api/ and renders
#     the Markdown with GitHub's Jekyll builder);
#   - `node scripts/build-site.cjs llms` writes llms.txt at the repository root from `llms`; the site root gets
#     the same bytes.
# Every path is repository-relative and is copied to the SAME path in the site, so relative links keep working; a
# relative link to anything not in the site is rewritten to the repository at the built commit.
# test/docs/llms-txt.test.ts fails when a listed path does not exist, when llms.txt differs from its render, or when
# an llms entry is not part of the site (dl-116). Owned by user-docs' align-user-docs phase (its `produces:`): after
# editing this file, regenerate llms.txt with `node scripts/build-site.cjs llms`.
version: 1.2                     # 1.1 dl-128 items 3–4 (task-246): + docs/comparison.md and docs/case-study.md, as pages and in the Optional llms section; 1.2 dl-112 Q3 (i), dl-131 (task-289): the summary states determinism as the goal the Determinism Index measures
title: WingFoil
summary: "A structured harness for AI-assisted software development, built to make it deterministic, a goal it measures: it keeps a project's memory, DNA, directives and workflows in git, and serves them to humans and AI agents through a CLI and an MCP server."

# Markdown pages, rendered by Jekyll; the raw .md is served beside each page. README.md is the site index.
pages:
  - README.md
  - docs/user-guide.md
  - docs/cli-reference.md
  - docs/agents.md
  - docs/comparison.md
  - docs/case-study.md
  - CHANGELOG.md
  - COLLABORATION.md
  - CONTRIBUTING.md
  - SECURITY.md
  - CODE_OF_CONDUCT.md

# Directories copied as they are, recursively (the README's images and the runnable examples).
files:
  - docs/assets/
  - docs/examples/

# The llms.txt sections, in this order. An entry has either `path` (a file of the site) or `site_path` + `built_by`
# (a page the Pages workflow generates; `built_by` is the package.json script that builds it).
llms:
  - section: Docs
    entries:
      - title: User guide
        path: docs/user-guide.md
        about: "Step-by-step guide to configuring and using WingFoil in your own project, from `wingfoil init` to connecting an AI agent."
      - title: CLI reference
        path: docs/cli-reference.md
        about: "Every `wingfoil` command, one entry each: arguments, options, exit codes and output."
      - title: Guide for AI agents
        path: docs/agents.md
        about: "For an agent working in a project that uses WingFoil: how to read the project and change it without breaking its rules."
      - title: Examples
        path: docs/examples/README.md
        about: "Runnable, self-checking scripts, one per scenario, each printing the real output of every command it runs."
  - section: Optional
    entries:
      - title: API reference
        site_path: api/
        built_by: docs:api
        about: "The TypeScript API of the `wingfoil` package, generated by TypeDoc."
      - title: Comparison
        path: docs/comparison.md
        about: "WingFoil beside agent-rule files, spec-driven development tools, coding agents and IDEs, each fact about another tool with its source and the date it was read."
      - title: "Case study: WingFoil develops WingFoil"
        path: docs/case-study.md
        about: "How this repository governs itself with WingFoil, and the release-health figures measured at v0.1 and v0.2, with what is not measurable yet."
      - title: Changelog
        path: CHANGELOG.md
        about: "Release notes, one section per published version."
