# The fake adapter with `session.id: output` (task-356, `bug-375`; spec-016 §2.6, §3.5, as amended at the design
# gate; approver ruling D2 (a)): a headless work run's session id is read from the agent's stdout, the document
# the fake prints when a headless launch ends (`launch.headless.output: json`, `WINGFOIL_FAKE_AGENT_DOCUMENT`), at
# `session.field`. No id is assigned, so the launch argv carries no `--session-id`. Otherwise `fake.yaml`,
# with nothing looked up after the run.
name: fake-session-output
format: 1
command: node
verified_with: fake-agent 1.0.0
version_args: [ test/fixtures/agents/fake-agent.cjs, --version ]
launch:
  interactive:
    args: [ test/fixtures/agents/fake-agent.cjs, --mcp-config, "{mcp_config_file}", --prompt, "{bootstrap}" ]
    terminal: optional
  headless:
    args: [ test/fixtures/agents/fake-agent.cjs, --headless, --mcp-config, "{mcp_config_file}", --prompt, "{bootstrap}" ]
    output: json
prompt:
  via: arg
mcp:
  via: config-file
  template: |
    {"mcpServers": {"wingfoil": {"command": "{mcp_command}", "args": {mcp_args}}}}
session:
  id: output
  field: session_id
  resume:
    supported: false
usage:
  from: none
