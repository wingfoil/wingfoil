# The fake adapter with a terminal requirement (spec-016 §2.7, task-200): `fake.yaml` field for field,
# except its name and `launch.interactive.terminal: required`, declared explicitly. Under Jest and CI
# the child has no terminal, so `agent execute` refuses it with NO_TERMINAL at §3.3 step 12, the last
# check before the spawn: every earlier refusal of §3.7 is reachable with either fixture.
name: fake-terminal
format: 1
command: node
verified_with: fake-agent 1.0.0
version_args: [ test/fixtures/agents/fake-agent.cjs, --version ]
launch:
  interactive:
    args: [ test/fixtures/agents/fake-agent.cjs, --mcp-config, "{mcp_config_file}", --prompt, "{bootstrap}" ]
    terminal: required
  headless:
    args: [ test/fixtures/agents/fake-agent.cjs, --headless, --mcp-config, "{mcp_config_file}", --prompt, "{bootstrap}" ]
    output: json
prompt:
  via: arg
mcp:
  via: config-file
  template: |
    {"mcpServers": {"wingfoil": {"command": "{mcp_command}", "args": {mcp_args}}}}
session:
  id: assign
  assign_args: [ --session-id, "{session_id}" ]
  lookup_args: [ test/fixtures/agents/fake-agent.cjs, --lookup, "{session_id}" ]
  field: session_id
  resume:
    supported: true
    args: [ --resume, "{session_id}" ]
usage:
  from: lookup
  lookup_args: [ test/fixtures/agents/fake-agent.cjs, --lookup, "{session_id}" ]
  fields:
    model: model
    input: usage.input
    output: usage.output
    cache_read: usage.cache_read
    cache_write: usage.cache_write
summary:
  export_args: [ test/fixtures/agents/fake-agent.cjs, --summary ]
