# WingFoil — Project DNA (P2.4)
# Structural map of the project: modules, stacks, team + roles, resource paths.
# Authoritative project anatomy; lets agents navigate without full codebase scans.
# Source: docs/01_vision/01_product-brief.md, docs/02_requirements/03_sard/01_architecture.md
#
# Field-provenance legend (human-audit aid):
#   [SPEC]      = required or defined by the specifications (ref cited inline).
#   [AUTHORING] = authoring addition: coherent with the specs but not mandated by them.
# Spec-required top-level sections: modules, stacks, team (BDD P2.4-project-dna-config); paths (P2.5).
# Sections/fields without a [SPEC] ref are [AUTHORING].
version: 1.3                     # [AUTHORING] config-file format version (WingFoil convention)

# [AUTHORING] section — not required by P2.4; identity/strategy values sourced from the Product Brief.
project:
  name: WingFoil
  description: >-
    Open-source harness for AI-assisted software development that makes the
    process deterministic by giving humans and AI agents a structured,
    authoritative interface to the project (Memory, DNA, Directives, Workflow,
    Interaction Layer).
  license: MIT
  repository: WingFoil
  methodology: custom            # see .wingfoil/workflows.yaml (main: sw-life-cycle)
  # [SPEC] North Star metric ← Product Brief; formalized as REQ-SYS-07 (deterministic context).
  north_star: >-
    Determinism Index — two independent runs from the same specs + WingFoil
    config using different AI agents produce substantially equivalent software.

# ---------------------------------------------------------------------------
# Modules — the parts of the system (anatomy for navigation)   [SPEC: P2.4]
# Per-module `name` is [SPEC]; `description` and `path` are [AUTHORING] enrichment (navigation / `paths`).
# ---------------------------------------------------------------------------
modules:
  - name: core
    description: Shared domain logic; single behavior behind both CLI and MCP surfaces (REQ-SYS-05).
    path: src/core
  - name: validation
    description: Shared validation & ID-generation engine (spec-009); single two-pass Zod entry point every schema and surface calls.
    path: src/validation
  - name: storage
    description: Git-backed file storage (YAML + Markdown); single source of truth (REQ-SYS-01).
    path: src/storage
  - name: memory
    description: Project Memory pillar — git-backed documents with per-type state machines.
    path: src/memory
  - name: dna
    description: Project DNA pillar — structured project map (this file's domain).
    path: src/dna
  - name: directives
    description: Project Directives pillar — role-based rules (built-in + custom).
    path: src/directives
  - name: workflow
    description: Project Workflow pillar — phases/steps/atomic actions, include() composition.
    path: src/workflow
  - name: cli
    description: Human interface (Commander.js); `wingfoil` command surface.
    path: src/cli
  - name: mcp-server
    description: Agent interface (MCP over stdio, @modelcontextprotocol/sdk); Resources, Tools (Prompts v0.2).
    path: src/mcp
  - name: agent
    description: Agent execution (adr-012, spec-016) — adapter manifests under .wingfoil/agents/{built-in,custom}/; later the launcher and the run log.
    path: src/agent

# ---------------------------------------------------------------------------
# Stacks — technologies + methodologies in use   [SPEC: P2.4]
# Section required by P2.4; technology values are [SPEC] from Product Brief §Technical Stack.
# Generic, project-shape-agnostic form: flat lists of entries rather than fixed per-surface keys,
# so the schema fits any project shape. The list shape, `category`/`phase` values (free strings,
# not enums), and the `methodologies` list are [AUTHORING].
# ---------------------------------------------------------------------------
stacks:
  technologies:
    - name: TypeScript
      category: language
    - name: Node.js
      category: runtime
      version: "22.12+"   # [SPEC] Product Brief §Technical Stack; floor set by adr-010 (supersedes adr-005's runtime clause)
    - name: npm
      category: package-manager
    - name: Commander.js
      category: framework
      notes: CLI command surface (P2 Interaction Layer)
    - name: Model Context Protocol
      category: protocol
      notes: Agent interface; transport over stdio; implemented in src/mcp via the @modelcontextprotocol/sdk package (ADR-004)
    - name: js-yaml
      category: library
      notes: YAML parse/dump for all git-backed storage files (src/validation/yaml.ts, src/core/loaders.ts)
    - name: Zod
      category: validation
    - name: Jest
      category: testing
      notes: coverage target >80%
    - name: TypeDoc                            # [AUTHORING] dl-014/dl-013 — API-docs build + public-symbol coverage gate
      category: documentation
      notes: public-symbol TSDoc coverage gate (dev-loop refactor checks), staged per dl-014 B-DECISION Option 2
    - name: git
      category: storage
    - name: npm registry (public)
      category: distribution
    - name: semantic versioning
      category: versioning
  methodologies:
    - name: Lean Inception
      phase: inception
    - name: User Story Mapping
      phase: specification
    - name: Specification by Example (BDD)
      phase: specification
    - name: SARD
      phase: specification
    - name: TDD
      phase: delivery
      notes: test-first; see the testing directive

# ---------------------------------------------------------------------------
# Team & roles — approval/directives bind to roles, never hardcoded people (REQ-SYS-08, P5.4.1)
# [SPEC: P2.4 (team) / REQ-SYS-08 (role binding)]. `members` is [SPEC]; `agents` + `approval_authority` are [AUTHORING].
# ---------------------------------------------------------------------------
team:
  members:
    - name: Roberto Pompermaier
      email: robypomper@gmail.com
      roles: [ tech-lead, architect, developer, reviewer, product-owner, approver, facilitator, qa ]
  # AI agents execute under a role (developer/reviewer/...) but never hold approval
  # authority; approvals route to the `approver` role (Roberto).
  agents:                        # [AUTHORING] agent execution model (concept ← REQ-SYS-08; field shape authoring)
    - name: AI agent (Claude/Cursor/etc.)
      executes_as: [ developer, reviewer, qa, architect ]
      approval_authority: false
  # Available agent roles (P5.4.1); nested under `team` so `dna show --section team` surfaces them.
  # [SPEC: REQ-SYS-08 / BDD P5.4.2 "unknown role '...' (not defined in dna.yaml)"]; per-role `description` is [AUTHORING].
  # (was cited as P4.20, which is template-customization; the quoted message is P5.4.2's — flagged in both
  #  passes of task-034-role-based-binding and corrected here.)
  roles:
    - name: developer
      description: Writes code and creates features; applies code-quality and testing directives.
    - name: reviewer
      description: Reviews code/docs against team standards; approves or rejects.
    - name: qa
      description: Tests features, validates acceptance criteria, runs checks.
    - name: architect
      description: Makes design decisions, records them as Memory decisions.
    - name: product-owner
      description: Owns scope, backlog, and release planning.
    - name: tech-lead
      description: Sets architecture, defines conventions, final approver.
    - name: facilitator
      description: Drives discovery/inception sessions (Lean Inception).
    - name: approver
      description: Holds approval authority for deliverables and releases.

# Conventions — the former `conventions:` section (documentation / engineering / process rules) was
# removed in v1.1 and its rules relocated to .wingfoil/directives/custom/ (per spec-002 Consequences):
#   documentation.versioning  → doc-versioning directive       engineering.methodology  → testing directive
#   documentation.traceability → traceability directive          engineering.coverage     → testing directive
#   engineering.versioning     → stacks.technologies (semver)    process.determinism      → determinism directive
#   process.commits            → code-quality directive          process.release_cadence  → traceability directive
#
# ---------------------------------------------------------------------------
# Resource paths — queried by `wingfoil paths [category]` (P2.5)   [SPEC: P2.5]
# Category names (sources, tests, docs, config, governance) are [SPEC] (X_cli-cmds.md); entries are [AUTHORING].
# ---------------------------------------------------------------------------
paths:
  sources:
    - src/
  tests:
    - test/
  docs:
    - docs/
    - docs/01_vision/
    - docs/02_requirements/
  config:
    - package.json
    - tsconfig.json
  governance:
    - .wingfoil/                   # this dogfooding configuration
