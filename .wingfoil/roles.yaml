# WingFoil — Directive role assignments (P3.2, P3.7)
# Binds directives to roles defined in .wingfoil/dna.yaml. One directive may bind to many roles.
# NOTE: this hand-authored configuration predates the P3.8 built-in templates `wingfoil init` now
# installs, so the P3.8 templates live in `custom/` as stand-ins. Reconciling them with the shipped
# templates is not scheduled (bug-040 corrected only the documentation saying they did not exist).
# Bindings name directive ids (`frontmatter.id`), never `name` (dl-060, spec-011). Approval/directives
# bind to roles, never to people (REQ-SYS-08).
#
# `security` (the P3.8 Security template, REQ-SEC-08) is global since task-133 (dl-059 option 1), as
# the `init` scaffold binds it; its WingFoil elaboration `security-secrets` stays global beside it.
# Both load for every role: their credential rules overlap but do not conflict.
#
# `command-baseline` (dl-080 option (B), task-094) binds to the three roles that write or gate a
# command: it must be loaded before a read is written, and before a review lets one through.
# `claim-evidence` is global — its measured instances are acceptance criteria and bug fields as
# often as TSDoc, so binding it to the coding roles alone would miss most of them.
#
# `git-conventions` (dl-119 Q2 (b), task-178) is global: its subject, identity and attribution clauses
# bind whoever commits — the approver's approve commits, the facilitator's and product-owner's captures
# — not only the developer. Declared global here and by `scope: global` in its file (task-144).
version: 1.4

assignments:
  developer:
    - code-quality
    - testing
    - determinism
    - command-baseline
  reviewer:
    - code-review
    - traceability
    - command-baseline
  qa:
    - testing
  architect:
    - architecture
    - determinism
    - traceability
    - command-baseline
  product-owner:
    - traceability
  tech-lead:
    - architecture
    - code-review

# Global directives apply to every role.
global:
  - doc-versioning
  - documentation
  - security
  - security-secrets
  - claim-evidence
  - git-conventions
