# WingFoil — vision-change (MAIN workflow)
# Startable entry point to change the vision after inception — a new feature (the most common case, a
# feature request) or any other edit of docs/01_vision/ — recorded as a `change-proposal` Memory element
# (dl-132 Q1 (a)). Its impact along the traceability chain is analysed before acceptance, only the layers
# the analysis names are downcast (Q2 (ii)), and it ends only when the change is assigned to a release
# (dl-132 element 4). Multiple mains are allowed: REQ-STATE-03.
# Source: dl-132-vision-change-and-feature-ingest (Actions 2–3); dl-109 (a sub may be included by any
# phase, so the downcast subs need no change); uses the `change-proposal` Memory type (memory.yaml).
name: vision-change
kind: main
description: Change the vision (a new feature or any other vision edit) through a change-proposal, its impact analysis, a scoped downcast and a release assignment.
version: 1.0
# No fixed `element:` — self-creating (spec-003 Layer 2 `element`): the change-proposal its capture phase
# adds becomes the instance's element.
phases:
  - name: capture
    description: >-
      Record the change-proposal: the change, its impact analysis per layer (feature, user stories, BDD,
      SARD, delivered elements — "no impact" stated for a layer it does not touch) and the target release.
      A contributor's request (COLLABORATION.md) is completed by a maintainer before the submit.
    role: product-owner
    actions:
      - 'memory.add(type: change-proposal)'
      - memory.submit                          # change-proposal: draft -> in-analysis
    produces:
      - "docs/04_memory/change-proposals/{id}.md"
    checks:
      post: ["frontmatter.required: [title, kind]"]   # mirrors memory.yaml `change-proposal` template.frontmatter.required

  - name: impact-analysis
    description: >-
      Walk the traceability chain backwards from the change (traceability directive) and check the
      element's analysis against it: every feature, user story, BDD scenario, SARD requirement and
      delivered task/ADR/spec it touches is named, every untouched layer says "no impact". The approver
      accepts the change (approval gate); a reject sends it back to capture to revise.
    role: architect
    actions:
      - agent.execute                          # the reverse walk above, under the architect's session prompt (dl-090 Q6)
      - memory.approve                         # change-proposal: in-analysis -> accepted (a reject: -> draft)
    approval: { by_role: approver }
    fallback: { step: capture }

  - name: update-vision
    description: >-
      Apply the accepted change to the vision documents the analysis names (the feature row in
      06_features.md, a journey, a persona, the MVP canvas), each with its doc-versioning bump, and update
      docs/01_vision/00_index.md in the same commit (dl-132 element 5).
    role: product-owner
    checks:
      post: ["vision-index.current"]          # the bug-270 test: the index matches every vision file (bound in workflows/bindings.yaml)

  - name: downcast-stories
    description: "User stories for the delta only — run when the analysis names a user-story impact (dl-132 Q2 (ii))."
    optional: true
    include: user-story-mapping

  - name: downcast-scenarios
    description: "BDD scenarios for the delta only — run when the analysis names a BDD impact (dl-132 Q2 (ii))."
    optional: true
    include: specification-by-examples

  - name: downcast-requirements
    description: "SARD requirements for the delta only — run when the analysis names a requirement impact (dl-132 Q2 (ii))."
    optional: true
    include: volere-requirements

  - name: schedule
    description: >-
      Assign the change to a release: its entry in docs/01_vision/07_sequencer.md (with the budget it moves,
      dl-096) and the feature ids in the release element's `features:`, so release-planning's define-scope
      finds it; stamp the element's `release` and move it to `scheduled` (dl-132 element 4).
    role: product-owner
    actions:
      - element.set_release("{change-proposal.target_release}")   # stamp `release` on the change-proposal (traceability directive)
      - element.set_state(scheduled)                               # change-proposal: accepted -> scheduled
    checks:
      post: ["vision-index.current"]          # the sequencer edit updates its index row in the same commit (dl-132 element 5)
