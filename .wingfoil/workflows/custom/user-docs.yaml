# WingFoil — user-docs (SUB workflow)
# dl-013 — user-facing documentation gate, between implementation and release-submit. Include-only.
# dl-025 (v1.1) — extended to own AGENT-facing docs too, as a sibling phase rather than by widening
#   align-user-docs: verifying CLAUDE.md against dna.yaml/memory.yaml/workflows.yaml/roles.yaml is
#   architect work, and "agent docs are stale" and "user docs are stale" have different remediations.
#   Since 1.3 the phase's body is the `agent-docs` workflow, which release-line-cycle includes too (dl-025:
#   the same phase re-aligns the agent docs at release-line close).
name: user-docs
kind: sub
description: >-
  Ensure the release's user-facing documentation is written and aligned before the release is
  assembled: README, user guide, CLI reference, working examples, CHANGELOG, and the community
  health files a contributor meets (dl-127). Makes documentation a hard release blocker (dl-013)
  instead of an unenforced convention.
version: 1.6                     # 1.1 dl-025: + align-agent-docs; 1.2 bug-170: align-agent-docs produces .wingfoil/WORKFLOW.md (task-148); 1.3 dl-025 (task-199): align-agent-docs includes the agent-docs workflow, which release-line-cycle reuses; 1.4 dl-127 Q4 (a) (task-214): align-user-docs produces COLLABORATION.md and the community health files; 1.5 dl-128 items 1–2 (task-224): align-user-docs produces the README demo's VHS tape and its GIF, checked by presentation.current and demo.rendered (manual); 1.6 dl-129 Q2 (b), Q3 (b) (task-234): align-user-docs produces llms.txt and docs/site.yaml, the documentation site's declared sources
element: release

phases:
  - name: check-implementation-complete
    description: "Pre-check: every task tagged for this release is `done` before user docs are finalized."
    role: tech-lead
    checks:
      pre: ["all tasks where tags=[{release.version}] are status: done"]

  - name: align-user-docs
    description: >-
      Write/align the user-facing documentation to the shipped CLI/feature surface for this release.
    role: developer
    produces:
      - "README.md"
      - "docs/user-guide.md"
      - "docs/cli-reference.md"
      - "docs/examples/"
      - "CHANGELOG.md"
      # dl-127 Q4 (a): the community health files, re-checked each release; COLLABORATION.md is the
      # canonical contribution model CONTRIBUTING.md points at (dl-020), and documents dl-163's
      # contributor / reported_by split.
      - "COLLABORATION.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - ".github/ISSUE_TEMPLATE/"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      # dl-128 items 1–2 (Q1 (a), Q2 (a)): the README's demo — a VHS tape that drives example 01, and the GIF it
      # renders, committed and regenerated each release. The README's badges are part of README.md above.
      - "docs/examples/01-first-project/demo.tape"
      - "docs/assets/wingfoil-demo-first-project.gif"
      # dl-129 Q2 (b), Q3 (b): the documentation site's declared sources (pages, copied directories, the llms.txt
      # index) and llms.txt, generated from them by `node scripts/build-site.cjs llms`; the pages it lists are produced
      # above, and .github/workflows/pages.yml publishes them with the TypeDoc output at each release tag.
      - "docs/site.yaml"
      - "llms.txt"
    checks:
      post:
        - "user-facing docs aligned with the release's shipped CLI/feature surface"
        - presentation.current       # dl-128: badges derived, tape drives the example, GIF committed and shown
        - demo.rendered              # dl-128, manual (approver 2026-10-10): re-record the tape by hand, see docs/assets/README.md § "Regenerating the demo GIF"
    approval: { by_role: approver }

  - name: align-agent-docs                   # [SPEC] dl-025 — agent-facing docs gate (shape B)
    description: >-
      Verify and align the agent-facing entry point against the config it projects. The phase's body
      (role architect, produces, checks, approval) is the agent-docs workflow, so that
      release-line-cycle runs the same phase at release-line close (dl-025).
    include: agent-docs
