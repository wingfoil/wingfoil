# WingFoil — user-story-mapping (SUB workflow) — DONE
# Specification Downcast Module 1 (Jeff Patton). Include-only.
# Source: docs/02_requirements/X_specs-downcast-plan.md §Module 1.
name: user-story-mapping
kind: sub
description: >-
  Explode the macro-flows of Lean Inception into atomic, value-oriented user stories;
  build the backbone (horizontal axis), vertically explode functionalities, apply the MVP cut.
version: 1.2                     # 1.1 bug-389 (task-301): every phase produces its module's output directory, so it completes by produces evidence instead of a workflow finalize; 1.2 task-358 (bug-435 item 4, bug-469): mvp-cut's check split into its inclusion half, a command could decide it (manual until a command), and its edge-case half, a reader's judgement (manual on purpose); no phase or step changes

phases:
  - name: backbone
    description: "Extract sequential user tasks from journeys to form the spine."
    role: product-owner
    produces:
      - "docs/02_requirements/01_user_story_map/"
  - name: vertical-explosion
    description: "Under each backbone step, write `As <persona>, I want <action> so that <benefit>`."
    role: product-owner
    produces:
      - "docs/02_requirements/01_user_story_map/"
  - name: mvp-cut
    description: "Tag stories [MVP · vX] / [Future] using the sequencer."
    role: product-owner
    produces:
      - "docs/02_requirements/01_user_story_map/"
    checks:
      post: ["100% of MVP Canvas features included", "edge-case stories generated"]   # split by task-358 (bug-435 item 4): the inclusion half compares the canvas's feature ids with the story map's, which a command could decide; the edge-case half is a reader's judgement
