# WingFoil — retrospective (SUB workflow)
# Best practice adapted to WingFoil. Include-only.
name: retrospective
kind: sub
description: >-
  Close the release loop: EXPLORE the release's Execution Notes for friction, let the approver add
  points, capture what went well / what to improve as Memory, and feed adjustments into the next
  release planning.
version: 1.4                     # dl-019/retro-v0.1 — added explore + additional-points phases; 1.2 dl-104 D3/Action 2: explore produces a path (task-175); 1.3 dl-104 Action 2 (task-199): approve declares the Memory transition it stands for, explore's agent.mine_execution_notes becomes agent.execute (dl-090 Q6); 1.4 dl-115 Q1 (A) + Q3 (x), dl-163 (task-213): explore reads the ### Retrospective subsections first and lists every secondary source it was given; additional-points gains a checks.pre that every proposal and every consumer feedback note has one outcome (four, six for a consumer feedback note)
element: release

phases:
  - name: explore
    description: >-
      Read first the `### Retrospective` subsection that closes the running log of every task, bug and
      plan in the release scope (dl-115 Q1 (A): notes written during the release); then mine the
      `## Execution Notes` of every Memory document in scope (tasks, bugs, DLs, the release doc, plan
      outcomes) for process friction — deviations, blockers, rejection reasons, honest-TDD notes,
      tooling gaps, inter-task dependency friction. Then read every secondary source the phase is
      given — any input written outside the release's own Memory documents: the notes kept during the
      release for the next planning, points the approver hands over, a report or record another phase
      produced (a consumer feedback triage record, dl-163). The inventory lists each secondary source
      it was given, with the commit or sha read, and carries each item of a source that is a proposal
      as a proposal, never as a finding (dl-115 Q3 (x)): a proposal cannot emerge from mining the
      repository. Read-only; produces a structured, source-cited friction inventory grouped by theme.
      Parallelizable (cheap-model miners + synthesis).
    role: facilitator
    actions:
      - agent.execute                  # dl-090 Q6: the mining above, run under the facilitator's session prompt
    produces:
      # The source-cited friction inventory, grouped by theme, outside every Memory path (approver
      # ruling 2026-10-05; dl-104 D3: a produces entry is a path pattern an engine can test for existence).
      - "docs/06_retrospectives/rl-{release.release-line}/rel-{release.version}-friction-inventory.md"
    checks:
      # dl-115 Q3 (x): no command asserts it yet (unbound, a warning in v0.3); the facilitator checks it.
      post: ["secondary-sources.listed(every secondary source the phase was given, with the commit or sha read, in the friction inventory)"]

  - name: additional-points
    description: >-
      Approver gate: present the friction inventory + the identified improvement themes; the approver
      adds any further points to analyze (and, if a point implies a config/process change, a DL is
      spun off in capture). Before the gate, every item that is a proposal, and every consumer
      feedback note, has exactly one outcome (dl-115 Q3 (x), dl-163 S3d; the check below). A review
      checkpoint, not an approval-gated transition — no commit.
    role: approver
    checks:
      # dl-115 Q3 (x), amended 2026-10-07 with dl-163: a proposal is never read as a finding. Written over
      # every source listed before the gate, so the read record of a read-only phase added between
      # explore and this one (dl-163 S3d, collect-feedback) is one more source with no change here.
      # No command asserts it yet (unbound, a warning in v0.3).
      pre:
        - >-
          proposals.disposed(every item that is a proposal, and every consumer feedback note (dl-163),
          in every secondary source listed before this gate (the friction inventory's list, and the
          read record of any read-only phase run between explore and this one), has exactly one
          outcome: covered (by a theme or an existing disposition) | element (an existing element,
          with its id and a status read by command) | restated (a new proposal restated from versioned
          ground) | superseded (with the command that proves it); a consumer feedback note, which may
          be a defect rather than a proposal, may instead be declined (the approver does not take it
          up, with a reason) | needs-info (sent back to its consumer for more information))
    approval: { by_role: approver }

  - name: capture
    description: "Record retrospective learnings as a Memory decision-log."
    role: facilitator
    actions:
      - 'memory.add(type: decision-log, title: "Retrospective {release.version}")'
      - memory.submit
    produces:
      - "docs/04_memory/design/dls/retro-{release.version}.md"
    checks:
      post: ["frontmatter.required: [title]"]   # title always set by action above

  - name: approve
    description: "Approve the retrospective so its actions are committed."
    role: approver
    actions:
      # dl-104 Context §1: the approval IS a Memory transition, `wf(decision-log): approve retro-{version}`.
      # The typed set_state acts on the decision-log `capture` created (spec-017 §4.2) and, under
      # `approval:`, emits `approve` (spec-003's verb rule).
      - decision-log.set_state(ready)          # retro-{version}: in-discussion -> ready
    approval: { by_role: approver }
