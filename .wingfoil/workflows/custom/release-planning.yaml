# WingFoil — release-planning (SUB workflow)
# Best practice adapted to WingFoil. Include-only.
name: release-planning
kind: sub
description: >-
  Plan a release: confirm the pillar focus and scope, triage bugs and reconcile accumulated
  governance into their gated states, identify and spec shared artefacts up front, pull backlog
  tasks for the release, and stamp each included element with its `release`. Set the release
  element to `planning` then `in-development`.
version: 1.6                     # dl-016: added triage-bugs + reconcile-governance, record-adrs approve, build-backlog release-stamping; 1.2 dl-092: define-scope check gains `kind`; 1.3 dl-095 Q3 (B): + advance-pinned-build (task-112); 1.4 dl-133 Q1 (b): build-backlog check gains the task `kind` (task-150); 1.5 bug-175: define-scope check exempts the pre-dl-092 minors from `kind` (task-148); 1.6 bug-163: define-scope produces under rl-{release-line}/, as memory.yaml 2.3 files a release (task-164)
element: release

# Selection filter (dl-016 §1) — every phase that considers accumulated elements picks those whose
# `release` is EMPTY or == the release in planning. This re-offers approved-but-unassigned elements and
# never re-pulls ones already assigned elsewhere. Assignment (`release=`) happens only in build-backlog.

phases:
  - name: advance-pinned-build                 # dl-095 Q3 (B) — precondition step (task-112)
    description: >-
      Before the release is planned, move the published WingFoil build that manages this repository
      (`"wingfoil-released": "npm:wingfoil@X.Y.Z"` in package.json) to the newest PUBLISHED version of
      the release-line, if it is newer. Rule (dl-095 Q3): the pin moves forward only, never backwards,
      and only to a published build; every switch is its own commit changing only package.json and
      package-lock.json (`npm install --save-dev --save-exact wingfoil-released@npm:wingfoil@X.Y.Z`),
      noted in the active phase plan. The same rule applies after every published patch, when the
      in-flight release merges `main` after the patch's tag (Q3 (B)), and on a defect that blocks a step
      (move to a published fix; if none exists, work by hand, record it, file a bug for the next patch).
    role: tech-lead
    actions:
      - 'npm.pin_advance("wingfoil-released")'   # no-op when the pin already is the newest published version
    checks:
      pre: ["`npm run -s wingfoil -- --version` == the version package.json pins (the build in use is the pinned one)"]
      post:
        - "new pin >= old pin, and `npm view wingfoil versions` lists it (forward only, published only)"
        - "the switch commit changes only package.json and package-lock.json"
        - "`npm run check:lockfile` exit 0; `npm run check:mcp` exit 0"

  - name: define-scope
    description: "Confirm pillar focus + feature scope for the release (from the release Memory doc)."
    role: product-owner
    actions:
      - memory.submit                          # release: draft -> planning
    produces:
      - "docs/04_memory/planning/rl-{release-line}/{release.id}.md"   # mirrors memory.yaml `release` path (bug-163)
    checks:
      # dl-092: + kind. bug-175 (approver ruling 2026-09-30, release-planning-rel-v0.3-plan R20): the
      # releases added before dl-092 are immutable (memory.yaml `release` id_pattern) and carry no
      # `kind:`, so the check exempts them from that one field; every later release carries it. The
      # field list mirrors memory.yaml `release` template.frontmatter.required
      # (test/workflow/release-kind-rule.test.ts holds the three together).
      post: ["frontmatter.required: [title, kind, version, pillar, features, requirements, release-line] except kind for [minor-v0.1, minor-v0.2, minor-v0.3, minor-v0.4, minor-v1.0]"]

  - name: triage-bugs                          # dl-016 §2 phase 2 (new)
    description: >-
      Select in-scope `open` bugs (selection filter: release empty or == {release in planning}) and
      triage them so downstream phases see only `triaged` bugs. Not-selected bugs are left untouched.
    role: tech-lead
    where: { type: bug, status: [open], release: ["", "{release.version}"] }
    actions:
      - memory.approve                         # selected bugs: open -> triaged
    approval: { by_role: approver }
    fallback: { step: triage-bugs, set_state: closed }   # reject (incomplete/wontfix/dup): open -> closed

  - name: reconcile-governance                 # dl-016 §2 phase 3 (new)
    description: >-
      Sweep accumulated not-ready in-scope governance into its gated state so build-backlog/identify-specs
      never silently skip it. Idempotent — acts only on pre-gate elements (selection filter: release empty
      or == {release in planning}). Not-selected elements are left untouched.
    role: product-owner
    where: { type: [decision-log, adr], status: [in-discussion, pending], release: ["", "{release.version}"] }
    actions:
      - memory.approve                         # decision-log: in-discussion -> ready; adr (optional sweep, dl-016 open-q (a)=yes): pending -> accepted
    approval: { by_role: approver }
    fallback: { step: reconcile-governance, set_state: draft }   # reject (element incomplete): -> draft

  - name: record-adrs
    description: "Optionally record + approve Architectural Decision Records for this release's scope."
    role: architect
    optional: true
    actions:
      - 'memory.add(type: adr)'
      - memory.submit                          # adr: draft -> pending
      - memory.approve                         # adr: pending -> accepted (dl-016 — tasks never cite an unaccepted ADR)
    produces:
      - "docs/04_memory/design/adrs/{id}.md"
    checks:
      pre: ["spec-review.passed"]     # dl-022 — internal + cross-spec + BDD/vision + traceability review before accept
      post: ["frontmatter.required: [title, sard_ref]"]
    approval: { by_role: approver }

  - name: identify-specs
    description: >-
      Survey the release scope for file formats, schemas, constant sets, and module APIs that
      will be implemented by this release's tasks; scaffold a tech-spec for each one not yet
      covered by an approved spec. Runs before tasks are created so build-backlog can reference
      approved (or at least pending) specs instead of discovering gaps task-by-task.
    role: architect
    actions:
      - agent.survey_specs             # enumerate artefacts implied by the release scope/features
      - 'memory.add(type: tech-spec)'  # for each uncovered artefact: scaffold a new draft
      - memory.submit                  # fill spec content; move each spec draft -> pending
    produces:
      - "docs/04_memory/design/specs/{id}.md"
    checks:
      pre: ["spec-review.passed"]     # dl-022 — internal + cross-spec + BDD/vision + traceability review before approve
      post: ["frontmatter.required: [title, scope]"]
    approval: { by_role: approver }    # specs approved before tasks referencing them reach backlog
    fallback: { step: identify-specs }

  - name: build-backlog
    description: >-
      Create/triage task deliverables for the release, convert reconciled governance into tasks, and
      stamp the `release` assignment on every included element. For each in-scope `ready` DL, create
      the task(s) it implies (the DL STAYS `ready` — dl-017, no ready->in-develop). For each selected
      `triaged` bug, create one or more fix tasks (task.bug = the source bug's id) and schedule the bug
      into the release; from here the bug's own state tracks its derived task(s) automatically
      (dev-loop's `bug.sync_state`). Assignment (dl-016 §4): stamp `release = {release.version}` on
      every included decision-log, bug, tech-spec, adr, and task.
    role: product-owner
    actions:
      - 'memory.add(type: task, tags: ["{release.version}"])'                   # tasks created in draft
      - memory.submit                                                          # task: draft -> pending
      - 'memory.add(type: task, tags: ["{release.version}"], dl: "{dl.id}")'    # task(s) derived from each in-scope `ready` DL (DL stays ready — dl-017)
      - memory.submit
      - 'memory.add(type: task, tags: ["{release.version}"], bug: "{bug.id}")'  # one or more fix tasks per selected triaged bug
      - memory.submit                                                          # fix task(s): draft -> pending
      - bug.set_state(planned)                                                 # selected bugs: triaged -> planned (fix task(s) now exist)
      - element.set_release("{release.version}")                               # stamp `release` on every included DL, bug, tech-spec, adr, task (dl-016 §4)
    produces:
      - "docs/04_memory/{release}/{id}.md"
    checks:
      post: ["frontmatter.required: [title, release, kind]"]   # dl-133 Q1 (b): + kind (feature | fix), set here; mirrors memory.yaml `task` template.frontmatter.required

  - name: commit-backlog
    description: >-
      Approve the planned tasks into the backlog so the dev-loop can pick them up, then move the
      release into development.
    role: tech-lead
    actions:
      - task.set_state(backlog)                # task: pending -> backlog (per planned task)
      - release.set_state(in-development)       # release: planning -> in-development
    approval: { by_role: approver }
