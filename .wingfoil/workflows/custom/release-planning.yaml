# WingFoil — release-planning (SUB workflow)
# Best practice adapted to WingFoil. Include-only.
name: release-planning
kind: sub
description: >-
  Plan a release: confirm the pillar focus and scope, triage bugs and reconcile accumulated
  governance into their gated states, identify and spec shared artefacts up front, pull backlog
  tasks for the release, and stamp each included element with its `release`. Set the release
  element to `planning` then `in-development`.
version: 2.4                     # dl-016: added triage-bugs + reconcile-governance, record-adrs approve, build-backlog release-stamping; 1.2 dl-092: define-scope check gains `kind`; 1.3 dl-095 Q3 (B): + advance-pinned-build (task-112); 1.4 dl-133 Q1 (b): build-backlog check gains the task `kind` (task-150); 1.5 bug-175: define-scope check exempts the pre-dl-092 minors from `kind` (task-148); 1.6 bug-163: define-scope produces under rl-{release-line}/, as memory.yaml 2.3 files a release (task-164); 1.7 spec-003 alignment (task-199): record-adrs/identify-specs/build-backlog name their produces owner as { type, path } (dl-104 D3), build-backlog derives its DL and fix tasks from a selection, npm.pin_advance takes a key: value argument and the lockfile/MCP post-checks are two bound tokens (dl-090), agent.survey_specs becomes agent.execute; 1.8 dl-163 S3e (task-270): advance-pinned-build re-checks the wingfoil-cli directive against the new pin; 1.9 dl-100 §1–§4 (b), dl-102 §2 (task-230): reconcile-governance selects ready decision-logs for a coverage check only (approver ruling 2026-10-12 D2), define-scope states the 20 % reservation, build-backlog checks every criterion and stamps `wave:`, commit-backlog fixes `backlog_committed` and `waves:`; advance-pinned-build's mcp.registered names the KNOWN_READ_FAILURES cleanup (task-239 handover, bug-292); 2.0 (numerically, after 1.9) dl-132 element 4 (task-277, approver rulings 2026-10-10 item 5, 2026-10-12 D1 (c), D2): define-scope sweeps the scheduled change-proposals of the release into its features: (prose + the unbound change-proposals.swept post-check, no selection); 2.1 bug-342 (task-279, approver ruling 2026-10-12 D1 (a)): define-scope drops the hand-amend clause — `memory amend` accepts a release predating dl-092, its `kind` exemption read from memory.yaml `release` template.frontmatter.exempt, which the check restates; 2.2 dl-050 option 1 (task-215, batch ruling D1): reconcile-governance declares the pre-check role-directives.clean, `directives list --role` over every dna.yaml team.roles name, failing on any warning; 2.3 task-291 (dl-185 C4 (i)): advance-pinned-build's after-a-patch case is the merge forward of the patch's line `release/X.Y` into the in-flight release's integration branch, never `main` into the line; 2.4 task-305 (dl-206 Q1 (i), Q2 (i), dl-159 A2 item 5, bug-429, release-planning v0.3.2 R8, design gate D3–D6): triage-bugs and define-scope name a patch's eligibility test `git log --no-merges release/X.Y..main`, advance-pinned-build states the pin per line, that the merge forward keeps main's pin, the AGENTS.md §1 status sentence and the line's own node_modules
element: release

# Selection filter (dl-016 §1) — every phase that considers accumulated elements picks those whose
# `release` is EMPTY or == the release in planning. This re-offers approved-but-unassigned elements and
# never re-pulls ones already assigned elsewhere. Assignment (`release=`) happens only in build-backlog.

phases:
  - name: advance-pinned-build                 # dl-095 Q3 (B) — precondition step (task-112)
    description: >-
      Before the release is planned, move the published WingFoil build that manages this repository
      (`"wingfoil-released": "npm:wingfoil@X.Y.Z"` in package.json) to the newest PUBLISHED version of
      the release-line, if it is newer. Rule (dl-095 Q3): the pin moves forward only, never backwards,
      and only to a published build; every switch is its own commit changing only package.json and
      package-lock.json (`npm install --save-dev --save-exact wingfoil-released@npm:wingfoil@X.Y.Z`),
      noted in the active phase plan. The pin is per line (dl-159 A2 item 5, bug-429,
      release-planning-rel-v0.3.2-plan R8): the switch is committed on the release's integration branch —
      `main` for a minor, `release/X.Y` for a patch — and a patch line pins only published versions of its own X.Y
      (on `release/0.3` a `0.3.z`, never a `0.4.z`), a minor on `main` the newest published version of the
      release-line. The same rule applies after every published patch, when the
      in-flight release's integration branch merges the patch's line forward after the patch's tag —
      `release/X.Y` into `main`, never back (Q3 (B), dl-159 Decision 2, dl-185 C4 (i)); the merge forward keeps
      `main`'s pin (git-conventions §1 rule 5), and `main` moves its pin only by a switch commit of its own,
      never inside the merge — and on a defect that blocks a step
      (move to a published fix; if none exists, work by hand, record it, file a bug for the next patch).
      The pre-check reads the build installed in the worktree the phase runs in, so on a patch line it needs
      the line's own node_modules: run `npm ci` in the release worktree first (bug-429).
      On every pin advance the phase re-checks the `wingfoil-cli` directive (dl-163 S3e): it reads the
      bugs tagged `pinned-build` against the new pinned build, notes the surprises it no longer shows,
      and confirms which build runs which command still holds; a change to the directive is its own
      commit, after the switch commit. With every pin advance the phase also updates the project-status
      sentence of `AGENTS.md` §1, and only that sentence, in its own commit after the switch; the rest of
      `AGENTS.md` stays align-agent-docs' (dl-025), and a drift the re-check finds there is noted in the
      active phase plan for that phase.
    role: tech-lead
    actions:
      - 'npm.pin_advance(package: wingfoil-released)'   # no-op when the pin already is the newest published version; manual (workflows/bindings.yaml): the version to pin is read from `npm view`
    checks:
      pre: ["`npm run -s wingfoil -- --version` == the version package.json pins (the build in use is the pinned one)"]
      post:
        - "new pin >= old pin, and `npm view wingfoil versions` lists it (forward only, published only)"
        - "the switch commit changes only package.json and package-lock.json"
        - "the wingfoil-cli directive re-checked against the new pin (its pinned-build bugs read, its build table confirmed)"
        - "lockfile.pinned"           # `npm run check:lockfile` exit 0 (bound in workflows/bindings.yaml)
        - "mcp.registered"            # `npm run check:mcp` exit 0 (bound in workflows/bindings.yaml)
        # task-239 handover (bug-292, task-230): a KNOWN_READ_FAILURES entry for the old pin fails check:mcp: delete it when the new pin reads the Resource (scripts/check-mcp*).

  - name: define-scope
    description: >-
      Confirm pillar focus + feature scope for the release (from the release Memory doc). The scope
      reserves 20 % of the release's task budget for bug fixes and governance debt (dl-100 §4 (b), the
      planning rule; §4 (a), net bug flow, is release-health's measure): the reservation is stated in the
      release's `## Scope`, and build-backlog plans the feature tasks within the other 80 %.
      The scope also sweeps the vision changes scheduled into this release (dl-132 element 4, as dl-016
      sweeps decision-logs and bugs): read the `scheduled` change-proposals whose `release` is
      {release.version} and write their `feature` ids into the release's `features:` before its submit.
      On a release already past `draft`, the write is a `memory amend` of the release by the approver,
      whose `--reason` names the change-proposals swept. A release predating dl-092, which carries no
      `kind:`, is amended the same way: `memory amend` reads its exemption from memory.yaml (bug-342,
      task-279). For a `kind: patch` release an element of the scope is eligible only if its file has not
      changed on `main` since its line was cut, `git log --no-merges release/X.Y..main -- <file>` empty
      (dl-206 Q2 (i), release-planning-rel-v0.3.2-plan R8); any other is captured again on the line first
      (dl-206 Q1 (i), git-conventions §1).
    role: product-owner
    actions:
      - memory.submit                          # release: draft -> planning
    produces:
      - "docs/04_memory/planning/rl-{release-line}/{release.id}.md"   # mirrors memory.yaml `release` path (bug-163)
    checks:
      # dl-092: + kind. bug-175 (approver ruling 2026-09-30, release-planning-rel-v0.3-plan R20): the
      # releases added before dl-092 are immutable (memory.yaml `release` id_pattern) and carry no
      # `kind:`, so the check exempts them from that one field; every later release carries it. The
      # field list mirrors memory.yaml `release` template.frontmatter.required, and the exempt ids its
      # template.frontmatter.exempt, the one declaration `memory submit`/`memory amend` read (bug-342, task-279)
      # (test/workflow/release-kind-rule.test.ts holds them together).
      # task-277 (approver ruling 2026-10-12 D1 (c)): the sweep is declared as this check, not as a `where`
      # selection — a selection would be the target of memory.submit (spec-017 §4.2) and the release's state
      # would stop being evidence. Unbound until dl-166 Q2 (ii) binds it.
      post:
        - "frontmatter.required: [title, kind, version, pillar, features, requirements, release-line] except kind for [minor-v0.1, minor-v0.2, minor-v0.3, minor-v0.4, minor-v1.0]"
        - "change-proposals.swept(every feature id of a change-proposal with status scheduled and release {release.version} is in the release's features:)"

  - name: triage-bugs                          # dl-016 §2 phase 2 (new)
    description: >-
      Select in-scope `open` bugs (selection filter: release empty or == {release in planning}) and
      triage them so downstream phases see only `triaged` bugs. Not-selected bugs are left untouched.
      For a `kind: patch` release a bug is eligible only if its file has not changed on `main` since its
      line was cut, `git log --no-merges release/X.Y..main -- <file>` empty (dl-206 Q2 (i),
      release-planning-rel-v0.3.2-plan R8); any other is captured again on the line first (dl-206 Q1 (i),
      git-conventions §1).
    role: tech-lead
    where: { type: bug, status: [open], release: ["", "{release.version}"] }
    actions:
      - memory.approve                         # selected bugs: open -> triaged
    approval: { by_role: approver }
    fallback: { step: triage-bugs, set_state: closed }   # reject (incomplete/wontfix/dup): open -> closed

  - name: reconcile-governance                 # dl-016 §2 phase 3 (new)
    description: >-
      Sweep accumulated not-ready in-scope governance into its gated state so build-backlog/identify-specs
      never silently skip it. Idempotent — acts only on pre-gate elements (selection filter: release empty
      or == {release in planning}). Not-selected elements are left untouched.
      `ready` decision-logs are selected too (dl-100 §1, task-230), for a coverage check only (approver
      ruling 2026-10-12, D2): each one whose `release` is this release must be named by the `ref:` of a
      task of the release, else it is flagged for build-backlog. A `ready` one is never moved (it has no
      forward edge, dl-017) and never assigned here (assignment stays in build-backlog, dl-016 §4); since it
      stays `ready`, the selection never empties and the phase completes through spec-017 §4.7, as
      build-backlog's does.
    role: product-owner
    where: { type: [decision-log, adr], status: [in-discussion, pending, ready], release: ["", "{release.version}"] }   # + ready: task-230 (dl-100 §1, D2)
    actions:
      - memory.approve                         # decision-log: in-discussion -> ready; adr (optional sweep, dl-016 open-q (a)=yes): pending -> accepted
    approval: { by_role: approver }
    fallback: { step: reconcile-governance, set_state: draft }   # reject (element incomplete): -> draft
    checks:
      pre: ["role-directives.clean"]   # dl-050 option 1 (task-215): `npm run check:role-directives` exit 0 (bound in workflows/bindings.yaml)
      # task-230 (D2): unbound — no command asserts it yet (W_WORKFLOW_UNBOUND_TOKEN until P4.12, v1.0).
      post: ["ready-decision-logs.covered(each ready decision-log with release {release.version} is named by the ref: of a task of the release; an uncovered one is flagged, never moved or assigned here)"]

  - name: record-adrs
    description: "Optionally record + approve Architectural Decision Records for this release's scope."
    role: architect
    optional: true
    actions:
      - 'memory.add(type: adr)'
      - memory.submit                          # adr: draft -> pending
      - memory.approve                         # adr: pending -> accepted (dl-016 — tasks never cite an unaccepted ADR)
    produces:
      - { type: adr, path: "docs/04_memory/design/adrs/{adr.id}.md" }   # dl-104 D3: the ADRs this phase adds
    checks:
      pre: ["spec-review.passed"]     # dl-022 — internal + cross-spec + BDD/vision + traceability review before accept
      post: ["frontmatter.required: [title, sard_ref]"]
    approval: { by_role: approver }

  - name: identify-specs
    description: >-
      Survey the release scope for file formats, schemas, constant sets, and module APIs that
      will be implemented by this release's tasks; scaffold a tech-spec for each one not yet
      covered by an approved spec. Runs before tasks are created so build-backlog can reference
      approved (or at least pending) specs instead of discovering gaps task-by-task.
    role: architect
    actions:
      - agent.execute                  # dl-090 Q6: the survey above, run under the architect's session prompt
      - 'memory.add(type: tech-spec)'  # for each uncovered artefact: scaffold a new draft
      - memory.submit                  # fill spec content; move each spec draft -> pending
    produces:
      - { type: tech-spec, path: "docs/04_memory/design/specs/{tech-spec.id}.md" }   # dl-104 D3: the tech-specs this phase adds
    checks:
      pre: ["spec-review.passed"]     # dl-022 — internal + cross-spec + BDD/vision + traceability review before approve
      post: ["frontmatter.required: [title, scope]"]
    approval: { by_role: approver }    # specs approved before tasks referencing them reach backlog
    fallback: { step: identify-specs }

  - name: build-backlog
    description: >-
      Create/triage task deliverables for the release, convert reconciled governance into tasks, and
      stamp the `release` assignment on every included element. For each in-scope `ready` DL, create
      the task(s) it implies (the DL STAYS `ready` — dl-017, no ready->in-develop). For each selected
      `triaged` bug, create one or more fix tasks (task.bug = the source bug's id) and schedule the bug
      into the release; from here the bug's own state tracks its derived task(s) automatically
      (dev-loop's `bug.sync_state`). Assignment (dl-016 §4): stamp `release = {release.version}` on
      every included decision-log, bug, tech-spec, adr, and task. Each task carries the key of the wave it
      runs in (`wave:`, dl-100 §1 (a), task-230), one of the waves commit-backlog fixes.
    role: product-owner
    # Selection (dl-016 §1, spec-003 § "Selections"): the in-scope `ready` decision-logs and `triaged` bugs
    # the derived tasks come from. `{decision-log.id}` / `{bug.id}` name each selected element of that type
    # (spec-017 §4.1); `bug.set_state` acts on the selected bugs (§4.2).
    where: { type: [decision-log, bug], status: [ready, triaged], release: ["", "{release.version}"] }
    actions:
      - 'memory.add(type: task, tags: ["{release.version}"])'                                # tasks created in draft
      - memory.submit                                                                       # task: draft -> pending
      - 'memory.add(type: task, tags: ["{release.version}"], dl: "{decision-log.id}")'       # task(s) derived from each selected `ready` DL (DL stays ready — dl-017)
      - memory.submit
      - 'memory.add(type: task, tags: ["{release.version}"], bug: "{bug.id}")'               # one or more fix tasks per selected triaged bug
      - memory.submit                                                                       # fix task(s): draft -> pending
      - bug.set_state(planned)                                                              # selected bugs: triaged -> planned (fix task(s) now exist)
      - element.set_release("{release.version}")                                            # stamp `release` on every included DL, bug, tech-spec, adr, task (dl-016 §4)
    produces:
      # dl-104 D3: the tasks this phase adds, filed under their own `release` (memory.yaml `task` path)
      - { type: task, path: "docs/04_memory/{task.release}/{task.id}.md" }
    checks:
      post:
        - "frontmatter.required: [title, release, kind]"   # dl-133 Q1 (b): + kind (feature | fix), set here; mirrors memory.yaml `task` template.frontmatter.required
        # dl-102 §2 (task-230): the check that ran before each task's pending -> backlog approval, stated in its Reason:.
        - "acceptance-criteria.consistent(each criterion read against the directives bound to the executing role and the ratified specs and decision-logs it touches, before pending -> backlog)"
        # task-230 review F1: a task whose wave is not listed never runs (wave.yaml's tasks filter on it).
        - "task.wave.declared(each task's wave is one of the release's waves)"

  - name: commit-backlog
    description: >-
      Approve the planned tasks into the backlog so the dev-loop can pick them up, then move the
      release into development. Before the approval the release document fixes `backlog_committed` (the
      count of its tasks now, dl-100 §2: the growth threshold's baseline, memory.yaml
      `release.growth_threshold`) and `waves:` (a non-empty list of wave keys, dl-100 §1 (a): a release with
      no `waves:` leaves implementation undecided, spec-017 §4.6); after it, only a wave's re-plan changes
      either, through `## Scope changes` (task-230). The deduction runs every listed wave at once, so
      commit-backlog lists only the waves to open now; re-plan appends the next.
    role: tech-lead
    actions:
      - task.set_state(backlog)                # task: pending -> backlog (per planned task)
      - release.set_state(in-development)       # release: planning -> in-development
    checks:
      pre:
        - "frontmatter.required: [backlog_committed]"   # dl-100 §2 (task-230): fixed here, before the approval
        # task-230 review F1: a separate check, since frontmatter.required counts a list value as missing outside memory.yaml's `lists:`.
        - "waves.declared(the release's waves: is a non-empty list of wave keys)"
    approval: { by_role: approver }
