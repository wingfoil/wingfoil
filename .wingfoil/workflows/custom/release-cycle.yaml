# WingFoil — release-cycle (SUB workflow)
# One iteration per release (v0.1 .. v1.0). Composes planning, per-wave dev loops,
# submission, publishing, and retrospective. Best practice adapted to WingFoil's weekly,
# per-pillar cadence. Include-only; sw-life-cycle iterates it over `release`.
# Git conventions: the `git-conventions` directive (.wingfoil/directives/custom/git-conventions.md,
# dl-119) — branch prefixes, --no-ff merges, and the release tag on the pushed `main` (dl-024, dl-074).
# Release candidate (dl-099 §1, task-219): the commit proposed for the version tag, on the release's
# integration branch; both e2e-smoke and the staging rehearsal must have passed on it, and a re-cut
# candidate re-enters both (the description below).
name: release-cycle
kind: sub
description: >-
  Deliver one release: plan scope -> run the release's waves, each a TDD dev-loop per backlog task
  (including bug-fix tasks) closed by a governance re-sweep, a re-plan checkpoint and the wave-end
  checks -> align user-facing docs -> e2e-smoke -> submit -> publish to npm -> measure release health -> retrospective.
  A release candidate is the commit of the release's integration branch proposed for the version
  tag (dl-099 §1); it is cut by release-publishing's `release-commit`. The two checks are the
  e2e-smoke gate (against the packed candidate, `e2e-smoke-passed`) and release-publishing's
  `staging-rehearsal`. The release commit does not re-cut the candidate: the e2e-smoke phase runs
  before it, so on the first candidate the rehearsal's smoke (the same scenario of
  `scripts/e2e-smoke.cjs`, against the staged tarball, with `--expect-commit`) stands as its e2e-smoke
  run. A candidate
  is re-cut whenever a commit that must ship lands on the integration branch after the checks ran —
  a fix for a failed rehearsal or publish, a late merge: the re-cut candidate re-enters `e2e-smoke`
  (and `submit`'s checks) and then `staging-rehearsal`, and only a candidate that has passed both is
  tagged. A commit that only records evidence (a gate report, a transcript, a Memory transition) does
  not re-cut: the tag goes on the candidate the checks named.
version: 1.5                     # dl-013: added user-docs phase (1.1); dl-119: git comment points to git-conventions (1.2); dl-099 §1 (task-219): the release candidate and its re-cut re-entry into e2e-smoke and staging-rehearsal (1.3); dl-089 §1 (task-222): + release-health between publishing and retrospective (1.4); dl-100 §1 (a), dl-133 §2 (task-230): implementation runs the release's waves (`wave`, iterate_over element:waves), each ending with re-sweep, re-plan and wave-checks (1.5)
element: release        # the iterated element provided by sw-life-cycle (iterate_over: release)

phases:
  - name: planning
    description: "Define release scope, story points, and the task backlog for this release."
    include: release-planning

  - name: implementation                     # dl-100 §1 (a) (task-230): the wave is the declared unit of implementation
    description: >-
      Run the release's waves (the release's `waves:`, fixed at commit-backlog and extended only at a
      wave's re-plan). The waves are ordered keys, but the deduction runs every listed wave at once
      (spec-017 §4.6): the next wave is opened by appending its key at the previous wave's re-plan. Each
      wave runs the TDD dev-loop once per backlog task whose `release` is this release and whose `wave` is
      that wave's key — including the fix tasks derived from bugs scheduled into this release, each keeping
      its source bug in sync (`bug.sync_state`) — then its boundary: the wave-end smoke and user-doc
      checks, the governance re-sweep and the re-plan checkpoint (`wave.yaml`).
    include: wave
    iterate_over: element:waves              # spec-003 § "Collections": the list in this release's `waves:` field, per release (dl-159)

  - name: user-docs                          # dl-013 — user-facing docs gate before submit
    description: >-
      Write/align README, user guide, CLI reference, examples, and CHANGELOG to the shipped surface
      before the release is assembled. Hard release blocker (dl-013).
    include: user-docs

  - name: e2e-smoke                          # dl-023 — fresh-init + CLI end-to-end smoke gate before submit (staged warn->reject)
    description: >-
      Run a real `wingfoil init` + drive the CLI surface, asserting exit codes + schema-valid
      scaffolded artifacts, before the release is assembled. Re-entered by a re-cut candidate (dl-099).
    include: e2e-smoke

  - name: submit
    description: "Assemble the release, run checks, request approval."
    include: release-submit

  - name: publishing
    description: >-
      Cut the release candidate, rehearse its publish on staging (`staging-rehearsal`), tag it, publish
      to npm; mark the release released. A candidate re-cut here re-enters e2e-smoke first (dl-099).
    include: release-publishing

  - name: release-health                     # dl-089 §1 — measure, compare with the previous run, propose; not a gate
    description: >-
      Measure the release at its measurement point with the fixed metric catalogue, compare every metric
      with the previous release's run and write the improvement proposals the retrospective disposes of.
      Runs on every release, including one whose publishing was skipped; D01 (outcome equivalence) only on
      major and minor releases (dl-089 §2, dl-131).
    include: release-health

  - name: retrospective
    description: "Capture learnings and adjust the next release."
    include: retrospective
