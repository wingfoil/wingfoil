# WingFoil — end-of-life (SUB workflow)
# Best practice adapted to WingFoil. Include-only; the final phase of sw-life-cycle.
name: end-of-life
kind: sub
description: >-
  Retire the product (or a major line) at end of life: announce, deprecate active Memory and
  releases, and archive. Documents remain in the repo (agents ignore deprecated content).
version: 1.1                     # 1.1 spec-003 alignment (task-199): deprecate acts on a selection (W_PHASE_ACTION_UNTARGETED), git.commit takes a key: value argument

phases:
  - name: announce
    description: "Record the end-of-life decision and timeline."
    role: product-owner
    actions:
      - 'memory.add(type: decision-log, title: "End-of-life plan")'
      - memory.submit
    checks:
      post: ["frontmatter.required: [title]"]   # title always set by action above
    approval: { by_role: approver }

  - name: deprecate
    description: "Deprecate the releases, ADRs and decision-logs still in force."
    role: tech-lead
    # Selection (spec-003 § "Selections"): every release not yet released and every ADR and decision-log
    # not yet archived — the elements `memory.deprecate` acts on (spec-017 §4.2). The phase is complete
    # when none is left. `superseded` is no deprecate target: only a later element's `supersedes:` reaches it
    # (memory.yaml `adr` `waiting: [ accepted ]`).
    where:
      type: [release, adr, decision-log]
      status: [draft, planning, in-development, releasing, pending, accepted, in-discussion, ready]
    actions:
      - memory.deprecate                        # each selected element: any state -> deprecated
    checks:
      post: ["deprecated content excluded from agent context and default search (REQ-STATE-06)"]

  - name: archive
    description: "Final commit; freeze the repository line."
    role: tech-lead
    actions:
      - 'git.commit(message: "end-of-life: archive")'
