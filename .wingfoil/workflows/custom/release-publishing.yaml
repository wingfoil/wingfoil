# WingFoil — release-publishing (SUB workflow)
# Best practice adapted to WingFoil. Include-only.
name: release-publishing
kind: sub
description: >-
  Publish an approved release: tag, build, publish to the npm registry, and mark the release
  element as released.
version: 1.3                     # 1.2 spec-003 alignment (task-199): the two agent.execute steps are one (the instructions are the description, dl-090 Q6 (b)), git and approver tokens take key: value arguments (spec-003 open question 6); 1.3 task-214: the tag phase names the release bump commit's files, SECURITY.md among them (its supported row follows package.json's minor, dl-127)
element: release

phases:
  - name: tag
    description: >-
      Create the semver git tag for the release ON `main`, after the release branch has merged —
      never on a phase branch (dl-024). The tag must be a stable ref reachable from main's permanent
      history so it survives phase-branch cleanup. The release commit is the version bump (spec-015
      §4) and carries every file that names the version: package.json, package-lock.json,
      server.json, CHANGELOG.md, and SECURITY.md, whose supported-versions row names the new minor
      (dl-127; test/docs/community-health.test.ts fails on a minor bump that leaves it behind).
    role: tech-lead
    checks:
      pre: ["on-branch-is-main", "release-branch-merged-to-main"]   # dl-024
    actions:
      - 'git.commit(message: "release {release.version}")'
      - 'git.tag(name: "{release.version}", on: main)'      # dl-024 — tag on main, not on a design/release_* branch

  - name: publish
    description: >-
      Run the tag's publish pipeline, then make the staged version live. The tag push runs
      `.github/workflows/publish.yml`: gate, Verdaccio staging + dl-023 smoke, then promote, which
      STAGES the same tarball on npm with `npm stage publish` through the stage-only OIDC trusted
      publisher — no token (adr-011, spec-015 §3 stage 4). A staged version is not live: after the
      pipeline run, the approver inspects it (`npm stage view <stage-id>`) and approves it on npm
      with 2FA (`npm stage approve <stage-id>`, or Approve on npmjs.com), or discards it with
      `npm stage reject` (dl-087 Action 3). The runbook in publish.yml's header lists the one-time
      registry-side setup this step presupposes.
    role: tech-lead
    actions:
      - agent.execute        # push the tag (publish.yml runs gate → stage → promote, `npm stage publish`), then report the stage id promote printed; nothing is live yet
      - 'approver.execute(command: "npm stage approve <stage-id>")'   # 2FA on npm — the version goes live (adr-011 point 3)
    checks:
      pre: ["tests.passing"]
      post: ["staged version approved on npm and live on the npm registry"]
    approval: { by_role: approver }   # the npm-publish environment deployment AND the npm stage approval (adr-011 point 3, dl-087 Q2 (iii))

  - name: mark-released
    description: "Mark the release element released."
    role: tech-lead
    actions:
      - element.set_state(released)            # release: releasing -> released
