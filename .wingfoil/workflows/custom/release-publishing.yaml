# WingFoil — release-publishing (SUB workflow)
# Best practice adapted to WingFoil. Include-only.
#
# The integration branch (dl-159 point 4, Action A1.8; task-288; git-conventions §1/§3). `tag` tags the
# release on its integration branch, which the phase names by the one value `integration_branch`. It is
# derived, never restated here: scripts/integration-branch.cjs computes it from the release's `kind` and
# `version` — the one declaration of the derivation (approver ruling D1; the release has no `branch` field,
# dl-159 A2.3, deferred) — and its `--check-head` mode is the pre-check `on-integration-branch`
# (bindings.yaml).
name: release-publishing
kind: sub
description: >-
  Publish an approved release: cut the release candidate (the version bump), rehearse its publish on a
  local staging registry, tag the candidate, publish it to the npm registry, and mark the release
  element as released. A candidate that has not passed both the e2e-smoke gate and the staging
  rehearsal is not tagged (dl-099 §1).
version: 2.1                     # 1.2 spec-003 alignment (task-199): the two agent.execute steps are one (the instructions are the description, dl-090 Q6 (b)), git and approver tokens take key: value arguments (spec-003 open question 6); 1.3 task-214: the tag phase names the release bump commit's files, SECURITY.md among them (its supported row follows package.json's minor, dl-127); 1.4 dl-099 §1–§2 (task-219): the release commit is its own phase, `release-commit`, so the `staging-rehearsal` phase (qa) runs on the candidate it cuts, and `tag` tags the candidate the rehearsal's transcript names; 1.5 dl-130 steps 1 and 4 (task-229): `publish` declares the service verify sweep as a `checks.pre` (warn), and its description names publish.yml's `release` job, which creates the GitHub Release once npm serves the version; 1.6 dl-130 step 2, bug-173, bug-174 (task-238): `publish` names publish.yml's `mcp-registry` job (the MCP Registry listing over GitHub OIDC), where npm's Staged Packages tab is, the automated review before Approve and the npx form of npm ≥ 11.15.0, and its post check names the listing; 1.7 dl-136 (task-244, approver rulings D3, D7): publish.yml's `release` job attaches the tag run's four test reports to the GitHub Release, `publish` produces the summary and coverage-summary.json committed under docs/07_gates/ keyed by version, its post check names the attached reports, and `release-commit`'s CHANGELOG section links the summary as the Release asset's absolute URL (review F5); 1.8 task-282 (bug-312, bug-310; dl-099 §1, task-219 D2): `tag` also pre-checks `evidence-only-since-candidate`, that the commits between the candidate and the tip change only the evidence paths its binding declares, and `staging-rehearsal` says what CI does: a gate run per candidate, while publish.yml's stage job stages the tagged build in CI; 1.9 task-288 (dl-159 A1.8, approver rulings D1–D3): `tag` tags on the release's integration branch, `on: integration_branch`, a minor on the pushed main and a patch on the pushed release/X.Y; its pre-checks on-branch-is-main and release-branch-merged-to-main become on-integration-branch, bound to scripts/integration-branch.cjs --check-head, and phase-branch-merged-to-integration-branch; 2.0 task-303 (dl-186 Q6, review finding 1), comment only: the unbound phase-branch-merged-to-integration-branch says a command decides it once the phase branches are declared, not that it is a reading; 2.1 task-306 (bug-428, bug-433, bug-405, release-planning v0.3.2 R8, approver rulings D1–D6): + merge-forward, the last phase, optional, role tech-lead, under the approver's approval: a patch's release/X.Y merged forward after the tag and mark-released, as git-conventions §1 rule 6 lists its commands, a minor recording it with workflow finalize (spec-017 §4.10); publish waits until the version's dist.tarball answers HTTP 200 and says tests.passing is the run on the release commit
element: release

phases:
  - name: release-commit
    description: >-
      Cut the release candidate. The release commit is the version bump (spec-015 §4) and carries
      every file that names the version: package.json, package-lock.json, server.json, CHANGELOG.md,
      and SECURITY.md, whose supported-versions row names the new minor (dl-127;
      test/docs/community-health.test.ts fails on a minor bump that leaves it behind). Once it is
      merged into the release's integration branch, the integration-branch commit that carries it is
      the release candidate (dl-099 §1): the commit proposed for the tag. The version's CHANGELOG
      section links its test-results summary by the absolute URL of the GitHub Release asset,
      https://github.com/wingfoil/wingfoil/releases/download/v{X.Y.Z}/test-results.md (v{X.Y.Z} the tag
      the release creates), since the section becomes the Release notes, where a relative link breaks
      (approver ruling F5). It is the same file `publish` later commits at
      docs/07_gates/rl-{release.release-line}/rel-{release.version}-test-results.md (dl-136). Not a blob
      URL at the tag: the tag names the candidate, and the summary is committed after it, so a blob there
      never resolves; the asset exists as soon as the Release does and names no branch (dl-159).
    role: tech-lead
    actions:
      - 'git.commit(message: "release {release.version}")'

  - name: staging-rehearsal                  # dl-099 §2 — a declared phase, not a plan convention
    description: >-
      Rehearse the publish of the release candidate on a local staging registry, with the candidate
      checked out and a clean working tree: `npm run publish:staging -- --expect-commit <candidate sha>
      --transcript <the produces path>` packs the candidate, publishes it to an ephemeral Verdaccio,
      installs it as a user would and runs the e2e smoke against it, whose `--version` must print the
      candidate's stamp (spec-015 §3 stages 2–3). The transcript is the run's own log, written on a
      failure too; its closing line is the verdict, which `staging-rehearsal-passed` reads together
      with the commit the smoke checked. A candidate re-cut after this phase ran (a commit that must
      ship lands after it) re-enters e2e-smoke and this phase (release-cycle). It starts a local
      registry: the rehearsal of the candidate is a gate run once per candidate (dl-099 §4 (a)), and
      `.github/workflows/publish.yml`'s `stage` job runs the same script again in CI on the tagged build,
      the tarball its gate job packed. Without `--tarball` the script packs the checkout: it refuses a
      change under the pack inputs and removes `dist/` first, so the pack rebuilds it from the commit.
    role: qa
    actions:
      - 'cli.run(command: "npm run publish:staging -- --expect-commit <candidate sha> --transcript <transcript>")'
    produces:
      - "docs/07_gates/rl-{release.release-line}/rel-{release.version}-staging-rehearsal.md"
    checks:
      post: ["staging-rehearsal-passed(transcript: docs/07_gates/rl-{release.release-line}/rel-{release.version}-staging-rehearsal.md)"]

  - name: tag
    description: >-
      Create the semver git tag for the release on its integration branch, after the release's phase
      branch has merged into it and the branch has been pushed: a minor is tagged on the pushed `main`,
      a patch on the pushed `release/X.Y` (dl-159 point 4; git-conventions §3, task-286) — never on a
      phase branch (dl-024). The tag must be a stable ref reachable from that line's permanent history
      so it survives phase-branch cleanup. `on-integration-branch` checks that HEAD is on the branch
      scripts/integration-branch.cjs derives from the release's `kind` and `version`. It goes on the
      release candidate the rehearsal transcript names (`staging-rehearsal-passed` prints that commit),
      not on a later commit such as the one that records the transcript: a candidate that has not passed
      both checks is not tagged (dl-099 §1). In the action, `on: integration_branch` names the branch
      the tag must be reachable from; the commit tagged is the candidate `staging-rehearsal-passed`
      prints. Commits that only record evidence
      do not re-cut the candidate (task-219 D2), and `evidence-only-since-candidate` checks it before the
      tag: it runs `git diff --name-only <candidate>..<tip>` and passes only when the candidate is an
      ancestor of the tip and every path is an evidence path, as its binding in bindings.yaml declares
      them; otherwise it names the paths, and the candidate is re-cut (dl-099 §1).
    role: tech-lead
    checks:
      pre:   # dl-024; dl-159 point 4 (task-288); dl-099 §1
        - 'on-integration-branch(kind: "{release.kind}", version: "{release.version}")'   # task-288, approver ruling D3: bound to scripts/integration-branch.cjs --check-head
        - "phase-branch-merged-to-integration-branch"   # unbound: a command (git merge-base --is-ancestor) decides it once the phase branches are declared (task-288 D3, task-303 D2 (a))
        - "staging-rehearsal-passed(transcript: docs/07_gates/rl-{release.release-line}/rel-{release.version}-staging-rehearsal.md)"
        - "evidence-only-since-candidate(transcript: docs/07_gates/rl-{release.release-line}/rel-{release.version}-staging-rehearsal.md)"   # task-282, bug-312
    actions:
      - 'git.tag(name: "{release.version}", on: integration_branch)'   # dl-024, dl-159 point 4 — tag on the integration branch, not on a design/release_* branch; `on:` names the branch, the commit is the candidate staging-rehearsal-passed prints (dl-099 §1)

  - name: publish
    description: >-
      Run the tag's publish pipeline, then make the staged version live. The tag push runs
      `.github/workflows/publish.yml`: gate, Verdaccio staging + dl-023 smoke, then promote, which
      STAGES the same tarball on npm with `npm stage publish` through the stage-only OIDC trusted
      publisher — no token (adr-011, spec-015 §3 stage 4). A staged version is not live: after the
      pipeline run, the approver inspects it (`npm stage view <stage-id>`) and approves it on npm
      with 2FA (`npm stage approve <stage-id>`, which needs npm ≥ 11.15.0 — without a global upgrade,
      `npx -y npm@<version> stage approve <stage-id>`; or Approve on npmjs.com under the account menu →
      Staged Packages, not on the package page), or discards it with `npm stage reject` (dl-087 Action
      3). A freshly staged version is first in "automated review", during which it cannot be approved:
      wait for the review to end (bug-174). Once npm serves that exact version, publish.yml's `release`
      job creates the GitHub Release with the version's CHANGELOG.md section as its notes, and its
      `mcp-registry` job publishes the MCP Registry listing of `server.json` with `mcp-publisher login
      github-oidc` (dl-130 step 2, bug-173); each polls npm for a bounded time, and if the approval comes
      later the approver re-runs the failed jobs (dl-130 step 1). Each waits with
      scripts/wait-npm-version.cjs until `npm view` lists the version and the version's `dist.tarball`
      answers HTTP 200 to a `HEAD` request: npm lists a version minutes before its registry serves the
      tarball, so "listed" alone is not "installable" (bug-433). The `release` job also attaches the
      gate's four test reports of the tag's run as Release assets — jest-results.json, coverage-summary.json,
      lcov.info and test-results.md (dl-136 Q1 (c), Q3 (a)). Once the Release exists, fetch the two kept
      in the repository, `gh release download <tag> --pattern test-results.md --pattern
      coverage-summary.json --dir <a temporary directory>`, and commit them at the produces paths on the
      branch the release is integrated on; they are merged forward like the release's other commits. The
      paths are keyed by the version, so two release lines never write the same file (dl-159).
      Before the tag is pushed, the service verify sweep lists every pending and active `service` element's
      `verify` command; the approver runs each and records its result with the date in this phase's plan
      (dl-130 step 4, Q3 (a): it reports and blocks nothing). The runbook in publish.yml's header lists the
      one-time registry-side setup this step presupposes. The pre-check `tests.passing` is the run on the
      release commit: the candidate the tag names, before the tag is pushed, run as the CI gate job runs
      it, with no git identity, `npm run test:no-identity -- --maxWorkers=2` (bug-405;
      release-publishing-rel-v0.3-plan D1).
    role: tech-lead
    actions:
      - agent.execute        # push the tag (publish.yml runs gate → stage → promote, `npm stage publish`, → release, the GitHub Release, and mcp-registry, the MCP Registry listing, once the version is live), then report the stage id promote printed; nothing is live yet
      - 'approver.execute(command: "npm stage approve <stage-id>")'   # 2FA on npm — the version goes live (adr-011 point 3)
    produces:
      - "docs/07_gates/rl-{release.release-line}/rel-{release.version}-test-results.md"
      - "docs/07_gates/rl-{release.release-line}/rel-{release.version}-coverage-summary.json"
    checks:
      pre: ["tests.passing", "services.verify-sweep"]   # dl-130 Q3 (a): the sweep is bound at severity warn
      post: ["staged version approved on npm, installable from the npm registry once its tarball answers HTTP 200, its GitHub Release created with the test reports attached and its MCP Registry listing published"]   # dl-130 Action 2: the Release (task-229) and the listing (task-238) are checked in the same prose check, so the unbound-check count does not move
    approval: { by_role: approver }   # the npm-publish environment deployment AND the npm stage approval (adr-011 point 3, dl-087 Q2 (iii))

  - name: mark-released
    description: "Mark the release element released."
    role: tech-lead
    actions:
      - element.set_state(released)            # release: releasing -> released

  - name: merge-forward                      # task-306 (bug-428; release-planning v0.3.2 R8; dl-159, dl-185 C1 (b))
    description: >-
      A patch only: merge its maintenance line `release/X.Y` forward into `main` with `--no-ff`,
      after the tag and `mark-released`, so `main` carries every fix the patch shipped (dl-159,
      dl-185 C1 (b): the merge comes when the patch line's state is final). The approver records this
      phase with `workflow finalize` first, the go-ahead, and the run's plan is ended with `workflow end`
      and merged into `release/X.Y`, which is pushed, so the merge forward brings the `done` plan with it
      (approver ruling D2 (a)). Then, in a detached worktree at `origin/main`'s head, the commands
      git-conventions §1 rule 6 lists, in its order: the merge with rule 5's resolutions, the version-bump
      test and the governance check, the push, and the fast-forward of the shared working tree. A conflict
      rule 5 does not resolve is aborted (`git merge --abort`), recorded in the plan and resolved by a
      developer before the merge is retried. A minor has no merge forward, its integration branch being
      `main` itself: the approver records the phase with `workflow finalize` and a `--reason`
      saying it has nothing to merge forward. Optional only in that a minor does no work in it: an
      optional last phase is never skipped (spec-017 §4.10), so every release records it.
    role: tech-lead
    optional: true
    actions:
      - 'git.merge(from: integration_branch, ff: false)'   # in the detached worktree: git merge --no-ff --no-commit of the patch's release/X.Y (git-conventions §1 rule 6)
      - agent.execute        # the version-bump test and the governance check, the push and the fast-forward of the shared working tree, as git-conventions §1 rule 6 lists them
    approval: { by_role: approver }   # the go-ahead, recorded with workflow finalize before the merge (approver ruling D2 (a))
