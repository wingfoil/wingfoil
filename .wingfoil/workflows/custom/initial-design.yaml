# WingFoil — initial-design (SUB workflow)
# Runs once per release-line, as the first phase of `release-line-cycle` (after that release-line
# is approved, before its `delivery`). Produces the minor-release roadmap for this release-line and
# records the architecture/product decisions and shared-artefact specs already implied by it —
# reusable as-is for v2, v3, ... whenever a new release-line starts (that was the whole point of
# extracting this out of wingfoil-init, which only runs once, ever, for config bootstrap).
# `seed-releases` was moved here from wingfoil-init: the roadmap is release-line-scoped, not
# project-wide-once, so it has to be re-runnable per release-line.
# `seed-specs` is the release-line-wide sibling of release-planning's `identify-specs`: same survey
# logic, but for artefacts spanning this release-line's whole arc rather than one release's task
# scope. identify-specs already dedupes against "not yet covered by an approved spec", so anything
# seeded here is not re-created once a release's own delivery starts.
# NOTE: the `wingfoil` CLI and MCP server ship and read this repository's own configuration (the
# pinned build, dl-095); `memory add/submit/approve/reject/deprecate` write these outputs' commits.
# There is no workflow engine: the workflow commands read and name a phase's steps but run none, and
# step execution (P4.10) is v1.0. So on THIS project a phase's actions are carried out through those
# verbs or by hand, against a `plan` element (dl-019); the outputs land under docs/04_memory/
# (resolved against the repository root).
name: initial-design
kind: sub
element: release-line   # the active element provided by release-line-cycle
description: >-
  Generate this release-line's minor-release roadmap, then record the initial Architectural
  Decision Records, Decision Logs, and Technical Specifications that formalize choices already
  implied by it — before this release-line's delivery begins.
version: 1.2                     # 1.1 bug-169: header describes the shipped CLI/MCP; bug-175: seed-releases states the release `kind` (task-148); 1.2 bug-163: seed-releases produces under rl-{release-line}/, as memory.yaml 2.3 files a release (task-164)

phases:
  - name: seed-releases
    description: "Generate the RELEASE Memory files (the roadmap) for this release-line, that delivery iterates over."
    role: product-owner
    actions:
      - 'memory.add(type: release, release-line: "{release-line.version}", kind: "minor")'  # one per planned minor release wave, created in draft; `kind` feeds id_pattern {kind}-{version} (dl-092)
    # No submit: the `release` machine has no `pending`; releases stay `draft` and `release-planning`
    # performs draft -> planning when delivery reaches each release.
    produces:
      - "docs/04_memory/planning/rl-{release-line}/{id}.md"   # mirrors memory.yaml `release` path (bug-163)
    checks:
      # field list mirrors memory.yaml `release` template.frontmatter.required, and the exemption
      # release-planning's define-scope states (bug-175, release-planning-rel-v0.3-plan R20)
      post: ["frontmatter.required: [title, kind, version, pillar, features, requirements, release-line] except kind for [minor-v0.1, minor-v0.2, minor-v0.3, minor-v0.4, minor-v1.0]"]

  - name: seed-adrs
    description: "Optionally record the initial Architectural Decision Records for this release-line."
    role: architect
    optional: true
    actions:
      - 'memory.add(type: adr)'        # optional initial ADRs
      - memory.submit                  # draft -> pending
      - memory.approve                 # pending -> accepted (approver role)
    produces:
      - "docs/04_memory/design/adrs/{id}.md"
    checks:
      pre: ["spec-review.passed"]     # dl-022 — internal + cross-spec + BDD/vision + traceability review before accept
      post: ["frontmatter.required: [title, sard_ref]"]

  - name: seed-dls
    description: "Optionally record the initial Decision Logs capturing product/process choices behind this release-line."
    role: architect
    optional: true
    actions:
      - 'memory.add(type: decision-log)'  # one per product/process decision
      - memory.submit                     # draft -> in-discussion
      - memory.approve                    # in-discussion -> ready (approver role)
    produces:
      - "docs/04_memory/design/dls/{id}.md"
    checks:
      post: ["frontmatter.required: [title]"]

  - name: seed-specs
    description: >-
      Survey this whole release-line (not one release) for shared file formats, schemas, constant
      sets, and module APIs already implied by its roadmap + the config; scaffold a tech-spec for
      each one not yet covered by an approved spec.
    role: architect
    optional: true
    actions:
      - agent.survey_specs             # enumerate release-line-wide artefacts (e.g. memory.yaml's own schema)
      - 'memory.add(type: tech-spec)'  # for each uncovered artefact: scaffold a new draft
      - memory.submit                  # draft -> pending
      - memory.approve                 # pending -> approved (approver role)
    produces:
      - "docs/04_memory/design/specs/{id}.md"
    checks:
      pre: ["spec-review.passed"]     # dl-022 — internal + cross-spec + BDD/vision + traceability review before approve
      post: ["frontmatter.required: [title, scope]"]
