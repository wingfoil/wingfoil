# WingFoil — release-submit (SUB workflow)
# Best practice adapted to WingFoil. Include-only.
name: release-submit
kind: sub
description: >-
  Assemble the release once its tasks are done: run pre-release checks, move the release into
  `releasing`, and gate on approval before publishing.
version: 1.3                     # 1.0 -> 1.1 at task-173: `pre-release-checks` declares `typecheck.clean` (dl-044); 1.2 task-219 (dl-099, the v0.2.2 carry-over): it declares `tests.no-identity`, the suite with no git identity; 1.3 task-244 (dl-136 Q4 (a), approver ruling D3): `pre-release-checks` runs `npm run test:report` on the candidate and produces its test-results summary, the evidence `approve-release` reads
element: release

phases:
  - name: pre-release-checks
    description: >-
      Verify all release tasks are done and the suite is green — also with no git identity, as the CI
      gate job runs it (`tests.no-identity`). Every check here runs on the release candidate's tree:
      when the candidate is re-cut, they run again (release-cycle). Bugs have no independent status
      here — their state is derived by dev-loop's `bug.sync_state` from their fix tasks, so the
      task check below covers them; the bug check is a redundant sanity check on the sync itself.
      The candidate's test results are recorded (dl-136 Q4 (a)): `npm run test:report` runs the suite
      once with coverage and Jest's JSON into coverage/, and `scripts/test-report.cjs` writes the Markdown
      summary — suites classified unit / integration / BDD / smoke / API-docs / lint.clean with their
      counts, the coverage totals, the commit and the build — at the produces path, written on a red
      run too. It is the evidence `approve-release` reads; the tag's CI run later records the published
      commit's (release-publishing).
    role: qa
    actions:
      - 'cli.run(command: "npm run test:report")'
      - 'cli.run(command: "node scripts/test-report.cjs --results coverage/jest-results.json --coverage-summary coverage/coverage-summary.json --build-info dist/build-info.json --commit <candidate sha> --out <the produces path>")'
    produces:
      - "docs/07_gates/rl-{release.release-line}/rel-{release.version}-test-results-candidate.md"
    checks:
      pre:
        - "all tasks where tags=[{release.version}] are status: done"
        - "all bugs where tags=[{release.version}] are status: [resolved, closed]"
        - "tests.passing"
        - "tests.coverage(min: 80)"
        - "typecheck.clean"            # dl-044, task-173: `npm run typecheck` — `tsc --noEmit` over tsconfig.json (src AND test) and tsconfig.build.json; asserted by test/lint/typecheck-clean.test.ts. Until this, `tsc --noEmit` ran only by hand here
        - "tests.no-identity"          # task-219 (dl-099; bug-172): `npm run test:no-identity` — the full suite with no git identity, as the CI gate job runs it; v0.2.2 reached its tag with five tests that failed only there

  - name: enter-releasing
    description: "Move the release element into the releasing state."
    role: tech-lead
    actions:
      - element.set_state(releasing)           # release: in-development -> releasing

  - name: approve-release
    description: "Final human approval before publishing."
    role: approver
    approval: { by_role: approver }
    fallback: { step: pre-release-checks }
