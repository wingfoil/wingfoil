# WingFoil — e2e-smoke (SUB workflow)
# dl-023 — standing fresh-init + CLI end-to-end smoke gate before release-submit. Include-only.
name: e2e-smoke
kind: sub
description: >-
  Black-box release gate: run a real `wingfoil init` into a throwaway project, then drive the
  scaffolded project through the CLI surface, asserting correct exit codes and schema-valid
  scaffolded artifacts. Would have caught bug-005 at release time instead of at the last task.
  STAGED per the dl-014 B-DECISION (Option 2): warn on failure until the gate runs green for a
  release, then flip to hard-reject.
version: 1.3                     # dl-082: `dna set` respelled to `<path> --value <v>` (task-093); 1.2 dl-026: + mcp-registration (task-112); 1.3 spec-003 alignment (task-199): cli.run takes a key: value argument, and the `memory add ...; memory submit ...` step is two tokens (dl-090 Q3 (a): no shell)
element: release

phases:
  - name: fresh-init
    description: "Run `wingfoil init` (each supported template) into a throwaway directory."
    role: qa
    actions:
      - 'cli.run(command: "wingfoil init")'
    checks:
      post: ["exit-code-zero", "scaffolded dna.yaml/memory.yaml/directives round-trip their own loaders (schema-valid)"]

  - name: drive-cli
    description: >-
      Exercise the scaffolded project through the CLI surface — dna show/set, memory add/submit,
      paths, directives list — against spec-005-cli-command-contract.
    role: qa
    actions:
      - 'cli.run(command: "dna show")'
      - 'cli.run(command: "dna set <path> --value <v>")'
      - 'cli.run(command: "memory add ...")'
      - 'cli.run(command: "memory submit ...")'
      - 'cli.run(command: "paths <category>")'
      - 'cli.run(command: "directives list")'
    checks:
      post: ["exit-codes match spec-005-cli-command-contract", "no schema-invalid artifact produced by any command"]

  - name: mcp-registration          # dl-026 re-verification, dl-095 Q2 (i) — task-112
    description: >-
      Re-verify the MCP server this repository's `.mcp.json` registers: it is the pinned published
      build (`wingfoil-released` in package.json), and the channel set it advertises equals the one
      `scripts/check-mcp-registration.cjs` declares (EXPECTED_CHANNELS — Resources P5.2.1, Prompts
      P5.2.2; Tools P5.2.3 from v0.4). A release that changes the channel set updates that constant on
      purpose, or this step fails.
    role: qa
    actions:
      - 'cli.run(command: "npm run check:mcp")'
    checks:
      post: ["exit-code-zero", "registered server version == package.json pin", "advertised channel set == EXPECTED_CHANNELS, every advertised list answers"]

  - name: gate
    description: >-
      Report smoke results. STAGED (dl-023 / B-DECISION Option 2): warn on failure until the gate runs
      green for a release, then flip to hard-reject so it blocks release-submit.
    role: qa
    checks:
      post: ["e2e-smoke-passed (staged: warn until green for a release, then hard-reject)"]
    approval: { by_role: approver }
