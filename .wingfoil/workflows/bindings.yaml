# WingFoil — token bindings (spec-003 Layer 3; dl-090 Q1 (a))
# Declares which command each project-bound `actions:` / `checks:` token of `workflows/custom/*.yaml` runs.
# The built-in tokens (memory.*, element.* / <type>.set_state, <type>.sync_state, element.set_release,
# config.init, agent.*) are WingFoil's and may not be rebound here (E_BINDING_BUILTIN_TOKEN).
#
# Rules (spec-003 Layer 3, dl-090):
#   - `run` is an argument vector, never passed to a shell (Q3 (a)); a placeholder fills a WHOLE element.
#   - a check exits 0 = pass, 1 = fail (routes to `fallback`), 2 = binding misconfiguration (Q4);
#     `severity` is `reject` unless declared `warn`. No check is bound to `wingfoil agent execute` (Q6).
#   - an action with no command is `manual: true`: WingFoil names the step, a human performs it (Q2 (c)).
#   - a check a human confirms on purpose is `manual: true` too (dl-172 (a)): exactly one of `run` / `manual`, and
#     no `severity` or `args` on it; it raises no W_WORKFLOW_UNBOUND_TOKEN.
#   - changed only through a task reviewed at dev-loop's `review` gate, never by an ordinary docs commit (Q5 (c)).
# Nothing runs a binding in v0.4: `workflow list` validates them and reports what is still unbound
# (W_WORKFLOW_UNBOUND_TOKEN, a warning until P4.10/P4.12 ship in v1.0). From task-358 (bug-469, approver ruling
# D1 (B)) no token of this repository is unbound: each check is bound `run` when a command decides it, or
# `manual: true` in one of the two groups below.
#
# The two manual groups (spec-003 Layer 3, as amended by task-358). The loader does not tell them apart; this file does.
#   - Manual on purpose (dl-172 (a), dl-186 Q6, task-303): a prose check whose condition is a reading or a judgement
#     no program can decide (spec-review.passed, the specification-phase quality criteria, the reviewer's and the
#     facilitator's readings, …). It stays manual at v1.0, when the engine waits for the confirmation.
#   - Manual until a command (task-358, superseding task-303's D1 (a) and bug-435's "left unbound until a command
#     exists" for these rows): a check a deterministic command could decide but none does yet (`frontmatter.required:
#     […]`, the Memory state queries, the advance-pinned-build comparisons, `tests.unchanged`, …). Each entry names the
#     command it owes; a `run` binding replaces the entry when that command exists. Until then the role named on the
#     phase applies it by hand, as before.
# Both are keyed by the check's prose as tokenName cuts it (the text before the first `(` or `:`); a reworded check
# comes back as a W_WORKFLOW_UNBOUND_TOKEN warning, which test/core/workflow-bindings-complete.test.ts refuses.
version: 3.3                     # 1.0 dl-090 Action 3 (task-199): the first bindings file — dev-loop's refactor gates (bound until now only in a YAML comment), then every remaining token a command or a manual step can carry; 1.1 bug-134 (task-207): e2e-smoke-passed writes its report and states severity: reject (dl-023); 1.2 git.merge also names dev-loop's main-sync, `from: main` (task-205, dl-035); 1.3 task-219 (dl-099 §1–§2): e2e-smoke-passed smokes the packed candidate (`--candidate`), staging-rehearsal-passed and tests.no-identity are bound; 1.4 dl-089 §1, dl-090 Action 4 (task-222): release-health's measure and compare bound to scripts/release-health/; 1.5 dev-loop v1.6 (task-221): typecheck.clean also gates dev-loop.refactor (dl-044), docs.parity names the document-parity suites dev-loop.review runs (dl-116 Action 4); 1.6 vision-index.current, vision-change's index check (task-212, bug-270); 1.7 services.verify-sweep, release-publishing.publish's service verify sweep at severity warn (task-229, dl-130 step 4); 1.8 presentation.current, user-docs.align-user-docs' README badges and demo (task-224, dl-128); demo.rendered stays unbound, a manual step (approver ruling 2026-10-10); 1.9 release-health.measure / .compare pass --any-node and --max-workers 2 (task-241, bug-344; dl-170's interim rule; approver ruling D3 2026-10-12); 2.0 docs.parity also runs test/docs/llms-txt.test.ts, the llms.txt / docs/site.yaml parity suite (task-234, dl-129 Q3 (b), dl-116; 1.9 on its branch, re-bumped at the W3 B7 gate after task-241); 2.1 role-directives.clean, release-planning.reconcile-governance's pre-check: `npm run check:role-directives` (dl-050 option 1, task-215, batch ruling D1; 1.9 on its branch, re-bumped at the W3 B7 gate after task-241 and task-234); 2.2 evidence-only-since-candidate, release-publishing.tag's pre-check that only evidence paths changed between the rehearsed candidate and the tip, the evidence paths declared in its --evidence arguments (task-282, bug-312, dl-099 §1, task-219 D2; approver rulings D2 (a), D3); 2.3 on-integration-branch, release-publishing.tag's pre-check that HEAD is on the release's integration branch, scripts/integration-branch.cjs --check-head (task-288, dl-159 A1.8, approver rulings D1, D3); the git.create_branch / git.merge / git.tag comments name the integration branch; 2.4 task-289: the presentation.current comment names dl-128 items 1–4 (task-246 added items 3–4 to the check, with no binding change); 2.5 task-298 (dl-172 (a)): demo.rendered bound `manual: true`, the check form spec-003 Layer 3 now allows; the rules and the user-docs comment say so; 2.6 task-303 (dl-186 Q6, dl-172 (a)): the 17 prose checks a human confirms on purpose (21 occurrences) bound manual: true, each group with its reason, keyed by their prose; the checks a command could decide stay unbound (86 to 65 warnings), the header says which; 2.7 task-306 (bug-428, bug-405, release-planning v0.3.2 R8, approver ruling D3), comments only: the git.merge comment names release-publishing.merge-forward's git.merge(from: integration_branch, ff: false), and the tests.passing comment says release-publishing.publish's tests.passing is the run on the release commit; 2.8 task-319 (bug-386, bug-387): on-integration-branch exits 2 when git cannot read HEAD, and its version pattern admits only a minor's vX.Y and a patch's vX.Y.Z with Z ≥ 1, the script refusing a version of the other kind's shape; 2.9 task-320 (bug-407), comment only: the release-health comment gives the pinned-Node command with a writable N_PREFIX, and the npx alternative; 3.0 task-348 (dl-205 Q1 (a)): pinned-build.reads, dev-loop.design's check that a .wingfoil/ shape change is loaded with the pinned build before red, bound manual: true; 3.1 task-358 (bug-469, bug-320, bug-435; approver rulings D1 (B), D3 (a), D4; spec-003 Layer 3 as amended): no token is unbound — retrospective.present bound run to scripts/check-retrospective.cjs on {element.path}, agents-md.current to test/docs/agents-md.test.ts (which docs.parity also runs), e2e-smoke.scenario to scripts/e2e-smoke.cjs --candidate; the checks a command could decide but none does yet bound manual: true in a group of their own, "manual until a command", each naming the command owed (68 to 0 warnings); the mixed checks split, the release-health and proposals.disposed reasons restated; 3.2 task-359 (dl-166 Q1 (b), Q2 (ii); approver rulings D2 (A), D3): change-proposal.assigned, vision-change.schedule's mandatory release exit, bound run to scripts/check-release-exit.cjs on {element.path}; downcast.in-scope, the scoped-downcast post-check of vision-change's three downcast phases, bound manual: true until a command, naming the command owed; 3.3 task-366 (dl-190 item 2 (c), approver ruling D8 (a)): governance-check-passed, release-publishing.tag's pre-check that the required governance check of the pushed integration branch's head passed, bound run to scripts/wait-governance-check.cjs with on-integration-branch's kind and version patterns
format: 1                        # dl-153 (A): a dl-149 file kind (BINDINGS_YAML_FORMAT)

checks:
  # dev-loop.refactor (dl-014 G5, dl-013, dl-034): the commands its comment named.
  # release-publishing.publish's pre-check (task-306, bug-405): there `tests.passing` is the run on the release commit,
  # the candidate the tag names, before the tag is pushed (the phase's description names the command).
  tests.passing:            { run: [npm, test] }
  # The 80 % threshold is jest.config.js's coverageThreshold (global: branches, functions, lines,
  # statements); the token's `min:` argument restates it, and test/core/workflow-repository-conformance.test.ts
  # holds the two equal, since `jest --coverage` takes no threshold argument.
  tests.coverage:           { run: [npm, run, "test:coverage"] }
  docs.api.public-complete: { run: [npm, run, "docs:api"] }   # TypeDoc notDocumented + treatWarningsAsErrors (typedoc.json)
  docs.api.build:           { run: [npm, run, "docs:api"] }
  lint.clean:               { run: [npm, run, lint] }
  # dev-loop.refactor and release-submit.pre-release-checks (dl-044; the command is task-173's).
  typecheck.clean:          { run: [npm, run, typecheck] }
  # dev-loop.review (dl-116 Action 4): the document-parity suites, by name — every test/docs suite citing dl-116
  # (test/core/dev-loop-v1-6.test.ts checks that each one is listed), plus command-surface-specs (dl-116 Q1 (A)'s
  # first enumeration), cli-reference (the model dl-116 names) and the enumeration-parity allowlist's own gate.
  docs.parity:              { run: [npm, test, --, test/docs/agents-md.test.ts, test/docs/cli-reference.test.ts, test/docs/command-surface-specs.test.ts, test/docs/commands-parity.test.ts, test/docs/enumeration-parity.allowlist.test.ts, test/docs/exit-codes-parity.test.ts, test/docs/llms-txt.test.ts, test/docs/mcp-surface-parity.test.ts, test/docs/memory-types-parity.test.ts, test/docs/name-resolvability.test.ts, test/docs/workflow-md.test.ts] }
  # release-submit.pre-release-checks (task-219, dl-099; bug-172): the suite with no git identity, as the CI
  # gate job runs it — scripts/test-no-identity.cjs.
  tests.no-identity:        { run: [npm, run, "test:no-identity"] }
  # dev-loop.review: the BDD scenarios are pinned by jest suites that cite their feature files
  # (docs/02_requirements/02_bdd/features/); there is no separate BDD runner.
  tests.bdd.passing:        { run: [npm, test] }
  # e2e-smoke.gate (dl-023: hard-reject from v0.3): the executable form of e2e-smoke.yaml. task-219 (dl-099 §1;
  # task-207's review): `--candidate` packs the checked-out commit (clean tree), installs the tarball into a
  # throwaway prefix and drives that bin by its absolute path, with the stamp bound — --expect-version =
  # package.json's version, --expect-commit = HEAD — so the report proves the candidate, not whatever
  # `wingfoil` is on PATH.
  # task-207 (bug-134): it writes the report the gate declares under produces:, passed as the check's
  # `report:` argument, rendered: a repository-relative path, so the pattern refuses an absolute path
  # (leading `/`), an option (leading `-`), a `..` segment and any character outside [A-Za-z0-9._/-].
  e2e-smoke-passed:         { run: [node, scripts/e2e-smoke.cjs, --candidate, --report, "{report}"], severity: reject, args: { report: '^(?![/-])(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9._/-]+$' } }
  # release-publishing.staging-rehearsal and tag (task-219, dl-099 §1–§2): the transcript's closing line is the
  # success line for package.json's name@version, and its smoke checked the stamp's commit — the candidate,
  # which the check prints. Same path rule as `report` above.
  staging-rehearsal-passed: { run: [node, scripts/publish-staging.cjs, --check-transcript, "{transcript}"], severity: reject, args: { transcript: '^(?![/-])(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9._/-]+$' } }
  # release-publishing.tag (task-282, bug-312; dl-099 §1, task-219 D2): the commits between the candidate the
  # transcript names and the tip change only evidence paths — `git diff --name-only <candidate>..<tip>`, and
  # the candidate must be an ancestor of the tip; otherwise the paths are named and the candidate is re-cut.
  # The evidence paths are declared HERE and nowhere else: the gate reports and the rehearsal transcript
  # (docs/07_gates/), the Memory transitions (docs/04_memory/) and the plans that record them (docs/05_plans/).
  evidence-only-since-candidate: { run: [node, scripts/publish-staging.cjs, --check-evidence-only, "{transcript}", --evidence, docs/04_memory/, --evidence, docs/05_plans/, --evidence, docs/07_gates/], severity: reject, args: { transcript: '^(?![/-])(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9._/-]+$' } }
  # release-publishing.tag (task-288, dl-159 point 4 / A1.8; git-conventions §3): HEAD is on the release's integration
  # branch — release/X.Y for a patch of vX.Y.Z, main for a minor or a release with no kind — as
  # scripts/integration-branch.cjs derives it, the one declaration of the derivation (approver ruling D1). `kind` is
  # empty for a release that predates dl-092 (memory.yaml release.template.frontmatter.exempt). Exit 1 = HEAD on
  # another branch or detached. Exit 2 = a kind or a version the derivation refuses (a minor's is vX.Y, a patch's
  # vX.Y.Z with Z ≥ 1), or a HEAD git cannot read (git cannot run, or not a repository): the phase is blocked, not
  # failed (spec-003 Layer 3). The version pattern admits only those two shapes; the script ties each to its kind,
  # which a placeholder pattern cannot see (task-319).
  on-integration-branch:    { run: [node, scripts/integration-branch.cjs, --check-head, --kind, "{kind}", --version, "{version}"], severity: reject, args: { kind: '^(minor|patch)?$', version: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.[1-9][0-9]*)?$' } }
  # release-publishing.tag (task-366, dl-190 item 2 (c), approver ruling D8 (a)): the tag waits for the required
  # `governance` check (svc-022) of the head of the integration branch's tracking ref, the one the derivation above
  # names, polled with `gh api` every --interval seconds (default 15) up to --timeout (default 1800).
  # Exit 1 = that run completed with another conclusion than success, or none completed in time.
  # Exit 2 = a kind or a version the derivation refuses, no tracking ref, or `gh` missing or failing.
  governance-check-passed:  { run: [node, scripts/wait-governance-check.cjs, --kind, "{kind}", --version, "{version}"], severity: reject, args: { kind: '^(minor|patch)?$', version: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\.[1-9][0-9]*)?$' } }
  # release-publishing.publish (task-229, dl-130 step 4, Q3 (a)): lists every pending and active service's
  # `verify` for the approver to run; it runs none of them. Exit 1 = a service file that does not parse or a
  # listed service with no `verify`. `warn`: it reports and blocks nothing in its first release (dl-023's staging).
  services.verify-sweep:    { run: [node, scripts/service-verify-sweep.cjs], severity: warn }
  # release-planning.advance-pinned-build (dl-095 Q3 (B), dl-026).
  lockfile.pinned:          { run: [npm, run, "check:lockfile"] }
  mcp.registered:           { run: [npm, run, "check:mcp"] }
  # release-planning.reconcile-governance (dl-050 option 1, task-215; batch ruling D1: this phase only, not dev-loop):
  # `directives list --role <r>` through the pinned build for every dna.yaml team.roles name; exit 1 on any warning
  # (no assignments, a dangling binding, a shadowed id), 2 on a misconfiguration — scripts/check-role-directives.cjs.
  role-directives.clean:    { run: [npm, run, "check:role-directives"] }
  # agent-docs.align-agent-docs (bug-170): WORKFLOW.md names every workflow and phase workflows.yaml includes.
  workflow-md.complete:     { run: [npm, test, --, test/docs/workflow-md.test.ts] }
  # agent-docs.align-agent-docs (task-358, bug-435 item 2; dl-025, dl-137): AGENTS.md's command list, Memory type
  # table, startable workflows and role table against CORE_MODULES, memory.yaml, workflows.yaml and roles.yaml, and
  # CLAUDE.md as its pointer — the parity suite docs.parity also runs (dl-116).
  agents-md.current:        { run: [npm, test, --, test/docs/agents-md.test.ts] }
  # e2e-smoke.fresh-init and .drive-cli (task-358, bug-435 item 1, approver ruling D3 (a)): the conditions in the
  # phases' descriptions — exit codes, re-loads through their own readers, a clean tree — asserted by the smoke's
  # scenario on the packed candidate, as the gate runs it, without the report.
  e2e-smoke.scenario:       { run: [node, scripts/e2e-smoke.cjs, --candidate] }
  # dev-loop.done (dl-115 Q2 (a), Action 3; task-358, bug-320): the task's ### Retrospective subsection, and that of
  # each closed bug of its bug: list, holds at least one line outside HTML comments ("None" counts). {element.path}
  # is the task's repository-relative file (spec-003 Layer 3 as amended); exit 1 names each file with no entry,
  # exit 2 a path that is not a Memory document of this repository. A plan's half is check-governance's
  # plan-retrospective, on every `wf(plan): finalize … [active → done]`.
  retrospective.present:    { run: [node, scripts/check-retrospective.cjs, "{element.path}"] }
  # vision-change.update-vision / schedule (dl-132 element 5, bug-270): docs/01_vision/00_index.md matches every vision file.
  vision-index.current:     { run: [npm, test, --, test/docs/vision-index.test.ts] }
  # vision-change.schedule (dl-166 Q2 (ii), dl-132 element 4; task-359): the change-proposal leaves schedule only once
  # its `release` is stamped, one release element has that version, the release's row of docs/01_vision/07_sequencer.md
  # names each of its feature ids and, on a release past `draft`, the release's features: holds them. {element.path} is
  # the change-proposal's repository-relative file; exit 1 names each failure, exit 2 a path that is not a
  # change-proposal of this repository.
  change-proposal.assigned: { run: [node, scripts/check-release-exit.cjs, "{element.path}"] }
  # user-docs.align-user-docs (dl-128 items 1–4: task-224, task-246): the README's badges are derived and its demo GIF
  # is committed and rendered from the tape that drives example 01; the comparison page and the case study keep their
  # shape (presentation.current).
  presentation.current:     { run: [npm, test, --, test/docs/presentation.test.ts] }
  # ==== Manual on purpose (dl-172 (a), dl-186 Q6, task-298, task-303, task-348): a reading or a judgement no program
  # can decide, so from v1.0 the engine waits for the confirmation instead of failing closed.
  # demo.rendered, re-recording the tape — a step by the approver's ruling of 2026-10-10 (VHS is a separate
  # binary, not an npm dependency, dl-010, and the recording rewrites a tracked file; task-298); the steps are in
  # docs/assets/README.md § "Regenerating the demo GIF".
  demo.rendered:            { manual: true }
  # specification-downcast, user-story-mapping, specification-by-examples, volere-requirements: whether a story map
  # covers its edge cases, a scenario is atomic and unambiguous, a Fit Criterion is measurable, is a reader's judgement.
  # The two edge-case halves are the judgement half of the checks task-358 split (bug-435 item 4).
  "edge-case stories present": { manual: true }
  "each scenario atomic + testable; zero ambiguous adjectives/adverbs": { manual: true }
  "every REQ has a numeric/percentage/boolean Fit Criterion": { manual: true }
  "edge-case stories generated": { manual: true }
  "each story has >=1 happy path and >=1 edge/error path": { manual: true }
  "no ambiguous adjectives/adverbs": { manual: true }
  "each scenario atomic and testable": { manual: true }
  "every REQ has a clearly numeric, percentage-based, or boolean Fit Criterion": { manual: true }
  # initial-design and release-planning: the dl-022 spec review is a reviewer's judgement, which no agent may assert
  # about its own work (dl-090 Q6).
  spec-review.passed:       { manual: true }
  # release-planning.advance-pinned-build: reading the wingfoil-cli directive's build table and its pinned-build bugs
  # against the new pin.
  "the wingfoil-cli directive re-checked against the new pin": { manual: true }
  # release-planning.build-backlog and dev-loop.design (dl-102 §4): each criterion read against the bound directives
  # and the ratified specs and decision-logs.
  acceptance-criteria.consistent: { manual: true }
  # dev-loop.design (dl-205 Q1 (a), task-348): a .wingfoil/ shape change loaded with the pinned build before red. The
  # proposed files exist only on the design's scratch copy (the task branch still holds the unchanged configuration),
  # and whether the task changes a shape and declares a break is the architect's reading: a run binding here would
  # pass for every task and prove nothing. The command half is gated later by check:mcp (mcp.registered).
  pinned-build.reads: { manual: true }
  # dev-loop.review: the reviewer re-runs the claims of a prose summary (dl-097 (a)) and re-verifies each item of the
  # previous reject's Reason (dl-098).
  claims.rerun:             { manual: true }
  rereview.previous-reject: { manual: true }
  # user-docs.align-user-docs (dl-013): the documents read against the release; what a command can assert is
  # presentation.current and docs.parity, bound above.
  "user-facing docs aligned with the release's shipped CLI/feature surface": { manual: true }
  # retrospective (dl-115 Q3 (x), dl-163 S3d): the sources the phase was given are not in the repository, a feedback
  # note is restated in WingFoil's words, and each proposal's outcome is the approver's disposition (the judgement
  # halves of the checks task-358 split, bug-435 item 4).
  secondary-sources.listed: { manual: true }
  feedback-notes.restated:  { manual: true }
  proposals.outcome-chosen: { manual: true }

  # ==== Manual until a command (task-358, bug-469, approver rulings D1 (B), D4): a deterministic command could decide
  # each check below, but none exists yet. Each comment names the command owed; a `run` binding replaces the entry
  # when it exists. Until then the phase's role applies the check by hand.
  # The created elements' required frontmatter (19 occurrences: every capture, seed, define-scope, build-backlog,
  # commit-backlog, dev-loop.design, retrospective.capture and end-of-life phase). The verbs refuse a missing required
  # field at `memory submit`; owed: a check over the phase's created elements, which no placeholder carries yet.
  frontmatter.required:     { manual: true }
  # service-ingest.capture: owed a command running spec-007's scanText over one element's file.
  secret-scan.clean:        { manual: true }
  # Memory queries (vision-change.schedule, release-planning, release-line-cycle, user-docs, release-submit,
  # end-of-life): `memory search` exits 0 whatever it finds; owed: a Memory query command with an exit status
  # (bug-435 Notes).
  "change-proposal.target_release is not empty": { manual: true }
  change-proposals.swept:   { manual: true }
  ready-decision-logs.covered: { manual: true }
  task.wave.declared:       { manual: true }
  waves.declared:           { manual: true }
  tech-spec.approved:       { manual: true }
  "all releases where release-line={release-line.version} are status": { manual: true }
  "all tasks where tags=[{release.version}] are status": { manual: true }
  "all bugs where tags=[{release.version}] are status": { manual: true }
  "deprecated content excluded from agent context and default search": { manual: true }
  # specification-downcast.backlog-export and backlog-export.validate: owed a JSON and dependency-graph check of
  # docs/03_backlog/04_backlog/backlog.json.
  "valid JSON; no duplicate IDs; no circular dependencies": { manual: true }
  "valid JSON parse":       { manual: true }
  "no duplicate IDs":       { manual: true }
  "no circular dependencies": { manual: true }
  # release-planning.advance-pinned-build: owed the three comparisons as one script — the pinned build's --version
  # against package.json, the new pin against the old one and `npm view wingfoil versions`, and
  # `git diff --name-only` of the switch commit.
  "`npm run -s wingfoil -- --version` == the version package.json pins": { manual: true }
  "new pin >= old pin, and `npm view wingfoil versions` lists it": { manual: true }
  "the switch commit changes only package.json and package-lock.json": { manual: true }
  # wave.wave-checks: owed one command running every docs/examples/*/run.sh (measure.cjs Q11 runs them as a metric).
  docs.examples.passing:    { manual: true }
  # dev-loop.start: owed the arithmetic over memory.yaml task.stop_the_line / release.growth_threshold and the tasks'
  # frontmatter, which the orchestrator applies by hand.
  stop-the-line.clear:      { manual: true }
  growth.clear:             { manual: true }
  # dev-loop.design (dl-015, dl-090 Q6; bug-320): owed a command reading the acknowledgement of every depends_on task
  # and every ref: decision-log from the Execution Notes.
  depends_on.acknowledged:  { manual: true }
  # dev-loop.red / .green / .refactor: the red commit's sha is in no placeholder; owed the T4 command
  # (`git log --first-parent --no-merges <red>..HEAD -- <files>`) and the red run, from that sha.
  tests.exist:              { manual: true }
  tests.failing:            { manual: true }
  tests.unchanged:          { manual: true }
  # dev-loop.green / .refactor / .review (dl-170, task-349): scripts/heavy-gate.cjs takes the lock inside the npm
  # scripts; owed a probe mode that reports the lock and the load without taking them.
  gate.slot-free:           { manual: true }
  # release-publishing.tag (task-288 D3, task-303 D2 (a), task-358 D4): no plan declares its phase branches; owed
  # `git merge-base --is-ancestor <phase branch> HEAD` once a plan declares them.
  phase-branch-merged-to-integration-branch: { manual: true }
  # release-publishing.publish: owed one check over `npm view`, `gh release view` and the MCP Registry API;
  # scripts/wait-npm-version.cjs polls only the first.
  "staged version approved on npm, installable from the npm registry once its tarball answers HTTP 200, its GitHub Release created with the test reports attached and its MCP Registry listing published": { manual: true }
  # release-health.measure / .compare / .propose (bug-435 item 3): no command reads a report against the catalogue
  # (docs/08_health/metrics.yaml) — scripts/release-health/ holds catalogue, compare and measure, none with a
  # report-check mode; owed: that mode.
  "every catalogue metric has a value or an explicit not-measurable reason": { manual: true }
  "every regressed metric and every breached floor has a finding": { manual: true }
  "every finding is tracked by an element or carries an RH proposal in the report's Proposals section": { manual: true }
  # specification-downcast.user-story-mapping and user-story-mapping.mvp-cut (bug-435 item 4, the coverage halves of
  # the split checks): owed a comparison of the MVP Canvas's feature ids with the story map's.
  "100% of MVP Canvas features covered": { manual: true }
  "100% of MVP Canvas features included": { manual: true }
  # retrospective.collect-feedback / .additional-points (bug-435 item 4, the mechanical halves): completeness and the
  # closed outcome set — one row per note with its cite, one outcome per item, each element outcome with an id and each
  # superseded one with a command. Owed: a command reading the read record and the listed sources.
  feedback-notes.recorded:  { manual: true }
  proposals.disposed:       { manual: true }
  # vision-change.downcast-stories / -scenarios / -requirements (dl-166 Q1 (b), task-359, approver ruling D2 (A)): the
  # US-*/REQ-* ids and feature files the phase adds or changes are those the change-proposal's impact analysis names for
  # its layer. No placeholder carries a phase's commits and the downcast commits are hand commits; owed: a command taking
  # the change-proposal and the phase's commits (from the update-vision finalize record of the element, plus a trailer
  # or subject convention naming it) and comparing what they touch with the analysis's subsection for the layer.
  downcast.in-scope:        { manual: true }

actions:
  # dev-loop.review (dl-014): the BDD acceptance scenarios run inside the jest suite.
  tests.bdd.run:            { run: [npm, test] }
  # dev-loop start/done (dl-014 G1–G3). The branch is `task/<id>` (git-conventions §1), cut from the task's
  # integration branch: a prefix around a placeholder is a partial interpolation no argv binding may express
  # (spec-003 open question 6), so these stay manual until a command takes the task id as a whole argument.
  git.create_branch:        { manual: true }
  git.create_worktree:      { manual: true }
  # `integration_branch` (task-288, dl-159 A1.8) is the integration branch of the task's release, which
  # `node scripts/integration-branch.cjs --kind <kind> --version <version>` prints from that release's frontmatter
  # (git-conventions §1: main, or release/X.Y for a patch).
  # git.merge(to: integration_branch, ff: false): switch to `to`, then `git merge --no-ff` the task branch — two commands.
  # git.merge(from: integration_branch) (dev-loop red/refactor, dl-035): `git merge --no-edit <integration branch>`
  # inside the task's worktree.
  # git.merge(from: integration_branch, ff: false) (release-publishing.merge-forward, task-306, bug-428): in a detached
  # worktree, `git merge --no-ff --no-commit origin/<integration branch>` of a patch's release/X.Y, as git-conventions §1
  # rule 6 lists its commands.
  git.merge:                { manual: true }
  git.remove_worktree:      { manual: true }
  # release-publishing.tag (dl-024) and end-of-life.archive: the commit message and the tag are the
  # approver's; git.tag(…, on: integration_branch) tags on the release's integration branch once it is pushed
  # (git-conventions §3).
  git.commit:               { manual: true }
  git.tag:                  { manual: true }
  # release-planning.advance-pinned-build (dl-095 Q3): the version to pin is read from `npm view` first.
  npm.pin_advance:          { manual: true }
  # e2e-smoke: each step names one CLI call; scripts/e2e-smoke.cjs is their executable form (spec-015 §3
  # stage 3). A command string is not an argument vector (dl-090 Q3 (a)), so the step is manual.
  cli.run:                  { manual: true }
  # release-publishing.publish: the 2FA `npm stage approve` no command can perform (dl-087, adr-011 point 3).
  approver.execute:         { manual: true }
  # release-health.measure / .compare (dl-089 §1, dl-090 Action 4): dl-089's `script.run("scripts/release-health/… --release …")`
  # family, as named tokens with a key: value argument (dl-090 Q3 (a)). The scripts are written by task-231..233
  # (measure.cjs) and task-241 (compare.cjs); these vectors are the command line they implement. The version is a
  # whole argument matching a release version (vX.Y or vX.Y.Z), so no option or path can be passed through it.
  # The Node rule (bug-344, task-241): the step measures under the Node that runs it. `--any-node` makes the toolchain
  # metrics (Q01–Q04, Q11, Q12, Q17) measured off the pipeline's pinned Node (`publish.yml` `env.NODE_VERSION`), each
  # entry recording `node` and `node_pinned`, rather than not-measurable; to measure under the pin, run the same vector
  # under `N_PREFIX=<writable-dir> n -d exec <NODE_VERSION>` (`n` caches under N_PREFIX, default /usr/local: where that
  # is root-owned it needs a directory you can write, bug-407) or `npx -p node@<NODE_VERSION>`. `--max-workers 2` is
  # dl-170's interim rule for the two jest runs. compare.cjs passes both to a like-for-like re-measurement of the
  # previous point (dl-089 §3).
  release-health.measure:   { run: [node, scripts/release-health/measure.cjs, --release, "{release}", --any-node, --max-workers, "2"], args: { release: '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' } }
  release-health.compare:   { run: [node, scripts/release-health/compare.cjs, --release, "{release}", --any-node, --max-workers, "2"], args: { release: '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' } }
