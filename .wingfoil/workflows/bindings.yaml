# WingFoil — token bindings (spec-003 Layer 3; dl-090 Q1 (a))
# Declares which command each project-bound `actions:` / `checks:` token of `workflows/custom/*.yaml` runs.
# The built-in tokens (memory.*, element.* / <type>.set_state, <type>.sync_state, element.set_release,
# config.init, agent.*) are WingFoil's and may not be rebound here (E_BINDING_BUILTIN_TOKEN).
#
# Rules (spec-003 Layer 3, dl-090):
#   - `run` is an argument vector, never passed to a shell (Q3 (a)); a placeholder fills a WHOLE element.
#   - a check exits 0 = pass, 1 = fail (routes to `fallback`), 2 = binding misconfiguration (Q4);
#     `severity` is `reject` unless declared `warn`. No check is bound to `wingfoil agent execute` (Q6).
#   - an action with no command is `manual: true`: WingFoil names the step, a human performs it (Q2 (c)).
#   - changed only through a task reviewed at dev-loop's `review` gate, never by an ordinary docs commit (Q5 (c)).
# Nothing runs a binding in v0.3: `workflow list` validates them and reports what is still unbound
# (W_WORKFLOW_UNBOUND_TOKEN, a warning until P4.10/P4.12 ship in v1.0).
#
# Deliberately unbound: the prose checks (`frontmatter.required: […]`, `spec-review.passed`, the
# specification-phase quality criteria, the release/branch state queries, …) have no command that asserts
# them today; each is listed with its reason in task-199's Execution Notes and stays a
# W_WORKFLOW_UNBOUND_TOKEN warning, which in v1.0 fails closed (dl-090 Q2 (c)).
version: 1.6                     # 1.0 dl-090 Action 3 (task-199): the first bindings file — dev-loop's refactor gates (bound until now only in a YAML comment), then every remaining token a command or a manual step can carry; 1.1 bug-134 (task-207): e2e-smoke-passed writes its report and states severity: reject (dl-023); 1.2 git.merge also names dev-loop's main-sync, `from: main` (task-205, dl-035); 1.3 task-219 (dl-099 §1–§2): e2e-smoke-passed smokes the packed candidate (`--candidate`), staging-rehearsal-passed and tests.no-identity are bound; 1.4 dl-089 §1, dl-090 Action 4 (task-222): release-health's measure and compare bound to scripts/release-health/; 1.5 dev-loop v1.6 (task-221): typecheck.clean also gates dev-loop.refactor (dl-044), docs.parity names the document-parity suites dev-loop.review runs (dl-116 Action 4); 1.6 vision-index.current, vision-change's index check (task-212, bug-270)
format: 1                        # dl-153 (A): a dl-149 file kind (BINDINGS_YAML_FORMAT)

checks:
  # dev-loop.refactor (dl-014 G5, dl-013, dl-034): the commands its comment named.
  tests.passing:            { run: [npm, test] }
  # The 80 % threshold is jest.config.js's coverageThreshold (global: branches, functions, lines,
  # statements); the token's `min:` argument restates it, and test/core/workflow-repository-conformance.test.ts
  # holds the two equal, since `jest --coverage` takes no threshold argument.
  tests.coverage:           { run: [npm, run, "test:coverage"] }
  docs.api.public-complete: { run: [npm, run, "docs:api"] }   # TypeDoc notDocumented + treatWarningsAsErrors (typedoc.json)
  docs.api.build:           { run: [npm, run, "docs:api"] }
  lint.clean:               { run: [npm, run, lint] }
  # dev-loop.refactor and release-submit.pre-release-checks (dl-044; the command is task-173's).
  typecheck.clean:          { run: [npm, run, typecheck] }
  # dev-loop.review (dl-116 Action 4): the document-parity suites, by name — every test/docs suite citing dl-116
  # (test/core/dev-loop-v1-6.test.ts checks that each one is listed), plus command-surface-specs (dl-116 Q1 (A)'s
  # first enumeration), cli-reference (the model dl-116 names) and the enumeration-parity allowlist's own gate.
  docs.parity:              { run: [npm, test, --, test/docs/cli-reference.test.ts, test/docs/command-surface-specs.test.ts, test/docs/commands-parity.test.ts, test/docs/enumeration-parity.allowlist.test.ts, test/docs/exit-codes-parity.test.ts, test/docs/mcp-surface-parity.test.ts, test/docs/memory-types-parity.test.ts, test/docs/name-resolvability.test.ts, test/docs/workflow-md.test.ts] }
  # release-submit.pre-release-checks (task-219, dl-099; bug-172): the suite with no git identity, as the CI
  # gate job runs it — scripts/test-no-identity.cjs.
  tests.no-identity:        { run: [npm, run, "test:no-identity"] }
  # dev-loop.review: the BDD scenarios are pinned by jest suites that cite their feature files
  # (docs/02_requirements/02_bdd/features/); there is no separate BDD runner.
  tests.bdd.passing:        { run: [npm, test] }
  # e2e-smoke.gate (dl-023: hard-reject from v0.3): the executable form of e2e-smoke.yaml. task-219 (dl-099 §1;
  # task-207's review): `--candidate` packs the checked-out commit (clean tree), installs the tarball into a
  # throwaway prefix and drives that bin by its absolute path, with the stamp bound — --expect-version =
  # package.json's version, --expect-commit = HEAD — so the report proves the candidate, not whatever
  # `wingfoil` is on PATH.
  # task-207 (bug-134): it writes the report the gate declares under produces:, passed as the check's
  # `report:` argument, rendered: a repository-relative path, so the pattern refuses an absolute path
  # (leading `/`), an option (leading `-`), a `..` segment and any character outside [A-Za-z0-9._/-].
  e2e-smoke-passed:         { run: [node, scripts/e2e-smoke.cjs, --candidate, --report, "{report}"], severity: reject, args: { report: '^(?![/-])(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9._/-]+$' } }
  # release-publishing.staging-rehearsal and tag (task-219, dl-099 §1–§2): the transcript's closing line is the
  # success line for package.json's name@version, and its smoke checked the stamp's commit — the candidate,
  # which the check prints. Same path rule as `report` above.
  staging-rehearsal-passed: { run: [node, scripts/publish-staging.cjs, --check-transcript, "{transcript}"], severity: reject, args: { transcript: '^(?![/-])(?!.*(?:^|/)\.\.(?:/|$))[A-Za-z0-9._/-]+$' } }
  # release-planning.advance-pinned-build (dl-095 Q3 (B), dl-026).
  lockfile.pinned:          { run: [npm, run, "check:lockfile"] }
  mcp.registered:           { run: [npm, run, "check:mcp"] }
  # agent-docs.align-agent-docs (bug-170): WORKFLOW.md names every workflow and phase workflows.yaml includes.
  workflow-md.complete:     { run: [npm, test, --, test/docs/workflow-md.test.ts] }
  # vision-change.update-vision / schedule (dl-132 element 5, bug-270): docs/01_vision/00_index.md matches every vision file.
  vision-index.current:     { run: [npm, test, --, test/docs/vision-index.test.ts] }

actions:
  # dev-loop.review (dl-014): the BDD acceptance scenarios run inside the jest suite.
  tests.bdd.run:            { run: [npm, test] }
  # dev-loop start/done (dl-014 G1–G3). The branch is `task/<id>` (git-conventions §1): a prefix around
  # a placeholder is a partial interpolation no argv binding may express (spec-003 open question 6), so
  # these stay manual until a command takes the task id as a whole argument.
  git.create_branch:        { manual: true }
  git.create_worktree:      { manual: true }
  # git.merge(to: main, ff: false): switch to `to`, then `git merge --no-ff` the task branch — two commands.
  # git.merge(from: main) (dev-loop red/refactor, dl-035): `git merge --no-edit main` inside the task's worktree.
  git.merge:                { manual: true }
  git.remove_worktree:      { manual: true }
  # release-publishing.tag (dl-024) and end-of-life.archive: the commit message and the tag are the
  # approver's, on main.
  git.commit:               { manual: true }
  git.tag:                  { manual: true }
  # release-planning.advance-pinned-build (dl-095 Q3): the version to pin is read from `npm view` first.
  npm.pin_advance:          { manual: true }
  # e2e-smoke: each step names one CLI call; scripts/e2e-smoke.cjs is their executable form (spec-015 §3
  # stage 3). A command string is not an argument vector (dl-090 Q3 (a)), so the step is manual.
  cli.run:                  { manual: true }
  # release-publishing.publish: the 2FA `npm stage approve` no command can perform (dl-087, adr-011 point 3).
  approver.execute:         { manual: true }
  # release-health.measure / .compare (dl-089 §1, dl-090 Action 4): dl-089's `script.run("scripts/release-health/… --release …")`
  # family, as named tokens with a key: value argument (dl-090 Q3 (a)). The scripts are written by task-231..233
  # (measure.cjs) and task-241 (compare.cjs); these vectors are the command line they implement. The version is a
  # whole argument matching a release version (vX.Y or vX.Y.Z), so no option or path can be passed through it.
  release-health.measure:   { run: [node, scripts/release-health/measure.cjs, --release, "{release}"], args: { release: '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' } }
  release-health.compare:   { run: [node, scripts/release-health/compare.cjs, --release, "{release}"], args: { release: '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' } }
